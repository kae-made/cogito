# yaml-language-server: $schema: ../schema/cim.schema.yaml
# conceptual modeling metamodel based change recognition definition

domains:
  "HoC":
    name: "History of Changes"
    datatypes:
      LifeStage:
        kind: "enumeration"
        items:
          - "created"
          - "deleted"
      temperature:
        kind: "primitive"
        basetype: "INTEGER"
      pressure:
        kind: "primitive"
        basetype: "REAL"
        unit: "Pascal"
      identity_code:
        kind: "primitive"
        basetype: "STRING"
        pattern: "^[A-Z]{3}-\\d{4}$"
      acceleration:
        kind: "complex"
        items:
          "x":
            type: "REAL"
          "y":
            type: "REAL"
          "z":
            type: "REAL"
    cclasses:
      "L_T":
        name: "Target"
        number: 1
        properties:
          "Target_Id":
            type: UNIQUE_ID
            identity: [1,2]
          "DomainName":
            type: REFERENCE
            identity: [2]
          "FoS_Id":
            type: REFERENCE
            identity: [2]
      "L_TI":
        name: "Instance Target"
        number: 2
        properties:
          "Target_Id":
            type: REFERENCE
            identity: [1,2]
          "DomainName":
            type: REFERENCE
            identity: [1,2]
          "ClassName":
            type: STRING
            identity: [2]
          "Associative_Target_Id":
            type: REFERENCE
          "FoS_Id":
            type: REFERENCE
            identity: [1]
      "L_TP":
        name: "Property Target"
        number: 3
        properties:
          "Target_Id":
            type: REFERENCE
            identity: [1]
          "DomainName":
            type: REFERENCE
            identity: [1]
          "Instance_Target_Id":
            type: REFERENCE
            identity: [2]
          "Instance_ClassName":
            type: REFERENCE
          "PropertyName":
            type: STRING
            identity: [2]
          "FoS_Id":
            type: REFERENCE
            identity: [1]
      "L_TL":
        name: "Link Target"
        number: 4
        properties:
          "Target_Id":
            type: REFERENCE
            identity: [1]
          "DomainName":
            type: REFERENCE
            identity: [1]
          RelationshipIndex:
            type: STRING
          "OneSide_Target_Id":
            type: REFERENCE
          "OtherSide_Target_Id":
            type: REFERENCE
          "FoS_Id":
            type: REFERENCE
            identity: [1]
      "L_TEI":
        name: "Event Instance Target"
        number: 5
        properties:
          "Target_Id":
            type: REFERENCE
            identity: [1, 2]
          "DomainName":
            type: REFERENCE
            identity: [1]
          "EventLabel":
            type: STRING
            identity: [2]
          "Destination_Target_Id":
            type: REFERENCE
          "Destination_ClassName":
            type: REFERENCE
          "Sender_Target_Id":
            type: REFERENCE
          "FoS_Id":
            type: REFERENCE
            identity: [1]
      "L_ESD":
        name: "Event Supplemental Data"
        number: 6
        properties:
          "Target_Id":
            type: REFERENCE
            identity: [1]
          "EventLabel":
            type: REFERENCE
            identity: [1]
          "ParameterName":
            type: STRING
            identity: [2]
          "Value":
            type: OTHER
      "L_C":
        name: "Changed"
        number: 7
        properties:
          "Changed_Id":
            type: UNIQUE_ID
            identity: [1]
          "EventTime":
            type: TIMESTAMP
          "Event_TA_Id":
            type: REFERENCE
      "L_VC":
        name: "Value Changed"
        number: 8
        properties:
          "Changed_Id":
            type: REFERENCE
            identity: [1]
          "Target_DomainName":
            type: REFERENCE
          "Target_Target_Id":
            type: REFERENCE
          Value:
            type: OTHER
          "FoS_Id":
            type: REFERENCE
      "L_CLF":
        name: "Life Changed"
        number: 9
        properties:
          "Changed_Id":
            type: REFERENCE
            identity: [1]
          "LifeStage":
            type: LifeStage
            identity: [1]
      "L_CI":
        name: "Instance Changed"
        number: 10
        properties:
          "Changed_Id":
            type: REFERENCE
            identity: [1]
          "Target_DomainName":
            type: REFERENCE
          "Target_Target_Id":
            type: REFERENCE
            identity: [2]
          "LifeStage":
            type: REFERENCE
            identity: [1,2]
          "FoS_Id":
            type: REFERENCE
      "L_CLK":
        name: "Link Changed"
        number: 11
        properties:
          "Changed_Id":
            type: REFERENCE
            identity: [1]
          "Target_DomainName":
            type: REFERENCE
          "Target_Target_Id":
            type: REFERENCE
            identity: [2]
          "LifeStage":
            type: REFERENCE
            identity: [1,2]
          "FoS_Id":
            type: REFERENCE
      "L_CEO":
        name: "Event Occurance Changed"
        number: 12
        properties:
          "Changed_Id":
            type: REFERENCE
            identity: [1]
          "Target_DomainName":
            type: REFERENCE
          "Target_Target_Id":
            type: REFERENCE
            identity: [2]
          "LifeStage":
            type: REFERENCE
            identity: [1,2]
          "FoS_Id":
            type: REFERENCE
      "L_FOS":
        name: "Field of Sense"
        number: 13
        properties:
          "FoS_Id":
            type: UNIQUE_ID
            identity: [1, 2]
          "DomainName":
            type: STRING
            identity: [2]
      "L_TA":
        name: "Temporal Axis"
        number: 14
        properties:
          "TA_Id":
            type: UNIQUE_ID
            identity: [1]
          "Name":
            type: STRING
      "L_CD":
        name: "Change Detection"
        number: 15
        properties:
          "Detection_Id":
            type: UNIQUE_ID
            identity: [1]
          "DetectionTime":
            type: TIMESTAMP
          Changed_Id:
            type: REFERENCE
          "TA_Id":
            type: REFERENCE
    relationships:
      R1001:
        kind: "is-a"
        referent:
          cclass: L_T
          properties:
            - Target_Id
            - DomainName
            - FoS_Id
        participants:
          - cclass: L_TI
            properties:
              - Target_Id
              - DomainName
              - FoS_Id
          - cclass: L_TP
            properties:
              - Target_Id
              - DomainName
              - FoS_Id
          - cclass: L_TL
            properties:
              - Target_Id
              - DomainName
              - FoS_Id
          - cclass: L_TEI
            properties:
              - Target_Id
              - DomainName
              - FoS_Id
      R1002:
        kind: "binary"
        referent:
          cclass: L_TI
          multiplicity: "1"
          phrase: "represent"
        participant:
          cclass: L_TP
          multiplicity: "MC"
          phrase: "is propertized by"
        referencing:
          - DomainName: DomainName
          - Target_Id: Instance_Target_Id
          - ClassName: Instance_ClassName
      R1003:
        kind: "binary"
        referent:
          cclass: L_TI
          multiplicity: "1"
          phrase: "kink to as one side"
        participant:
          cclass: L_TL
          multiplicity: "1C"
          phrase: "is one side of"
        referencing:
          - DomainName: DomainName
          - Target_Id: OneSide_Target_Id
          - FoS_Id: FoS_Id
      R1004:
        kind: "binary"
        referent: 
          cclass: L_TI
          multiplicity: "1"
          phrase: "link to as other side"
        participant:
          cclass: L_TL
          multiplicity: "1C"
          phrase: "is other side of"
        referencing:
          - DomainName: DomainName
          - Target_Id: OtherSide_Target_Id
          - FoS_Id: FoS_Id
      R1005:
        kind: "binary"
        referent:
          cclass: L_TL
          multiplicity: "1C"
          phrase: "may has as associative class"
        participant:
          cclass: L_TI
          multiplicity: "1C"
          phrase: "may be associated class of"
        referencing:
          - DomainName: DomainName
          - Target_Id: Associative_Target_Id
          - FoS_Id: FoS_Id
      R1006:
        kind: "binary"
        referent:
          cclass: L_TI
          multiplicity: "1"
          phrase: "is destination of"
        participant:
          cclass: L_TEI
          multiplicity: "MC"
          phrase: "receive"
        referencing:
          - DomainName: DomainName
          - Target_Id: Destination_Target_Id
          - ClassName: Destination_ClassName
      R1007:
        kind: "binary"
        referent:
          cclass: L_TEI
          multiplicity: "1"
          phrase: "supplement"
        participant:
          cclass: L_ESD
          multiplicity: "MC"
          phrase: "have"
        referencing:
          - Target_Id: Target_Id
          - EventLabel: EventLabel
      R1008:
        kind: "binary"
        referent:
          cclass: L_TI
          multiplicity: "1C"
          phrase: "is sent by"
        participant:
          cclass: L_TEI
          multiplicity: "MC"
          phrase: "may send"
        referencing:
          - DomainName: DomainName
          - Target_Id: Sender_Target_Id
          - FoS_Id: FoS_Id
      R1009:
        kind: "is-a"
        referent:
          cclass: L_C
          properties:
            - Changed_Id
        participants:
          - cclass: L_VC
            properties:
              - Changed_Id
          - cclass: L_CLF
            properties:
              - Changed_Id
      R1010:
        kind: "binary"
        referent:
          cclass: L_TP
          multiplicity: "1"
          phrase: "records the change of"
        participant:
          cclass: L_VC
          multiplicity: "M"
          phrase: "has as it history"
        referencing:
          - DomainName: Target_DomainName
          - Target_Id: Target_Target_Id
          - FoS_Id: FoS_Id
      R1011:
        kind: "is-a"
        referent:
          cclass: L_CLF
          properties:
            - Changed_Id
            - LifeStage
        participants:
          - cclass: L_CI
            properties:
              - Changed_Id
              - LifeStage
          - cclass: L_CLK
            properties:
              - Changed_Id
              - LifeStage
          - cclass: L_CEO
            properties:
              - Changed_Id
              - LifeStage
      R1012:
        kind: "binary"
        referent:
          cclass: L_TI
          multiplicity: "1"
          phrase: "rrecords the change of"
        participant:
          cclass: L_CI
          multiplicity: "M"
          phrase: "has as it history"
        referencing:
          - DomainName: Target_DomainName
          - Target_Id: Target_Target_Id
          - FoS_Id: FoS_Id
      R1013:
        kind: "binary"
        referent:
          cclass: L_TL
          multiplicity: "1"
          phrase: "records the change of"
        participant:
          cclass: L_CLK
          multiplicity: "M"
          phrase: "has as it history"
        referencing:
          - DomainName: Target_DomainName
          - Target_Id: Target_Target_Id
          - FoS_Id: FoS_Id
      R1014:
        kind: "binary"
        referent:
          cclass: L_TEI
          multiplicity: "1"
          phrase: "records the change of"
        participant:
          cclass: L_CEO
          multiplicity: "M"
          phrase: "has as it history"
        referencing:
          - DomainName: Target_DomainName
          - Target_Id: Target_Target_Id
          - FoS_Id: FoS_Id
      R1015:
        kind: "binary"
        referent:
          cclass: L_FOS
          multiplicity: "1"
          phrase: "presence within"
        participant:
          cclass: L_T
          multiplicity: "M"
          phrase: "confers meaning upon"
        referencing:
          - DomainName: DomainName
          - FoS_Id: FoS_Id
      R1016:
        kind: "binary"
        referent:
          cclass: L_TA
          multiplicity: "1"
          phrase: "is measured along"
        participant:
          cclass: L_C
          multiplicity: "MC"
          phrase: "is the axis of"
        referencing:
          - TA_Id: Event_TA_Id
      R1017:
        kind: "binary"
        referent:
          cclass: L_C
          multiplicity: "1"
          phrase: "detect"
        participant:
          cclass: L_CD
          multiplicity: "MC"
          phrase: "is detected by"
        referencing:
          - Changed_Id: Changed_Id
      R1018:
        kind: "binary"
        referent:
          cclass: L_TA
          multiplicity: "1"
          phrase: "is detected along"
        participant:
          cclass: L_C
          multiplicity: "MC"
          phrase: "is the axis of"
        referencing:
          - TA_Id: Event_TA_Id
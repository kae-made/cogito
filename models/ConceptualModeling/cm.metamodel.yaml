# yaml-language-server: $schema: ../schema/cim.schema.yaml
# comceptual modeling metamodel definition

domain:
  name: "metamodel of conceptual model"
  cclasses:
    # Conceptual Model
    cclass:
      - key_letter: CIM_CD
        name: "Conceptual Domain"
        number: 0
        properties:
          property:
            - name: Name
              type: STRING
              identity: [1]
            - name: Description
              type: STRING
      - key_letter: CIM_CC
        name: "Conceptual Class"
        number: 1
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1,2,3]
            - name: Name
              type: STRING
              identity: [1]
            - name: KeyLetter
              type: STRING
              identity: [2]
            - name: Number
              type: STRING
              identity: [3]
      - key_letter: CIM_PR
        name: "Property"
        number: 2
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: DataTypeName
              type: REFERENCE
      - key_letter: CIM_REL
        name: "Relationships"
        number: 3
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1,2]
            - name: index
              type: STRING
              identity: [1]
              mathematical: true
            - name: Number
              type: INTEGER
              identity: [2]
      - key_letter: CIM_DT
        name: "Data Type"
        number: 4
        properties:
          property:
            - name: DT_Id
              type: UNIQUE_ID
              identity: [1]
            - name: Name
              type: STRING
              identity: [2]
            - name: DomainName
              type: STRING
              identity: [2]
            - name: Grammar
              type: STRING
      - key_letter: CIM_ID
        name: "Identity"
        number: 5
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: Level
              type: INTEGER
              identity: [1]
      - key_letter: CIM_BPR
        name: "Base Property"
        number: 6
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: PropertyName
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_RPR
        name: "Reference Property"
        number: 7
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: PropertyName
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_ISR
        name: "is-a Relationship"
        number: 8
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: Index
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_BR
        name: "Binary Relationship"
        number: 9
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: Index
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_AR
        name: "Associative Relationship"
        number: 10
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: Index
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_CIR
        name: "CClass in Relationship"
        number: 11
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_RIR
        name: "Referent in Relationship"
        number: 12
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_PIR
        name: "Participant in Relationship"
        number: 13
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
            - name: Level
              type: REFERENCE
      - key_letter: CIM_CPID
        name: "Property in CClass Identity"
        number: 14
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: PropertyName
              type: REFERENCE
              identity: [1]
            - name: Level
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_IPIR
        name: "Identity Property in Relationship"
        number: 15
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
            - name: PropertyName
              type: REFERENCE
              identity: [1]
            - name: Level
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_REF
        name: "Reference"
        number: 16
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
            - name: PropertyName
              type: REFERENCE
              identity: [1]
            - name: Level
              type: REFERENCE
              identity: [1]
            - name: RefPropertyName
              type: REFERENCE
      - key_letter: CIM_SRIR
        name: "Super RIR"
        number: 17
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_FRIR
        name: "Form RIR"
        number: 18
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
            - name: Multiplicity
              type: STRING
            - name: Conditionality
              type: BOOLEAN
            - name: TextPhrase
              type: STRING
      - key_letter: CIM_BFRIR
        name: "Binary Form RIR"
        number: 19
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_ONRIR
        name: "One RIR"
        number: 20
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_OTRIR
        name: "Other RIR"
        number: 21
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_SPIR
        name: "Sub PIR"
        number: 22
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_PPIR
        name: "Part PIR"
        number: 23
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
            - name: Multiplicity
              type: STRING
            - name: Conditionality
              type: BOOLEAN
            - name: TextPhrase
              type: STRING
      - key_letter: CIM_APIR
        name: "Associative PIR"
        number: 24
        properties:
          property:
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      # Data Type
      - key_letter: CIM_RDT
        name: "Reference Data Type"
        number: 31
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
            - name: Refering_DT_Id
              type: REFERENCE
      - key_letter: CIM_UDT
        name: "User Data Type"
        number: 32
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
            - name: UnitName
              type: STRING
            - name: Base_DT_Id
              type: REFERENCE
      - key_letter: CIM_EDT
        name: "Enumerated Data Type"
        number: 33
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_EDTI
        name: "Enumerated Data Type Item"
        number: 34
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
      - key_letter: CIM_SDT
        name: "Structured Data Type"
        number: 35
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_SDTI
        name: "Structured Data Type Item"
        number: 36
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: Item_DT_Id
              type: REFERENCE
      # State Model
      - key_letter: CIM_SM
        name: "State Model"
        number: 100
        properties:
          property:
            - name: SM_Id
              type: UNIQUE_ID
              identity: [1]
            - name: DomainName
              type: REFERENCE
              identity: [2]
            - name: CClassName
              type: REFERENCE
              identity: [2]
      - key_letter: CIM_STT
        name: "State"
        number: 101
        properties:
          property:
            - name: SMStt_Id
              type: UNIQUE_ID
              identity: [1]
            - name: SM_Id
              type: REFERENCE
              identity: [2,3]
            - name: Number
              type: INTEGER
              identity: [2]
            - name: Name
              type: STRING
              identity: [3]
            - name: FinalState
              type: BOOLEAN
      - key_letter: CIM_SMEVT
        name: "Event"
        number: 102
        properties:
          property:
            - name: SMEvt_Id
              type: UNIQUE_ID
              identity: [1]
            - name: SM_Id
              type: REFERENCE
              identity: [2,3]
            - name: Label
              type: STRING
              identity: [2]
              mathematical: true
            - name: Number
              type: INTEGER
              identity: [2]
            - name: Meaning
              type: STRING
              identity: [3]
            - name: DelayTime
              type: TIMESPAN
      - key_letter: CIM_TXN
        name: "Transition"
        number: 103
        properties:
          property:
            - name: Txn_Id
              type: UNIQUE_ID
              identity: [1]
            - name: SM_Id
              type: REFERENCE
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_EVTDI
        name: "Event Supplemental Data Item"
        number: 104
        properties:
          property:
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: DT_Id
              type: REFERENCE
      - key_letter: CIM_PEVT
        name: "Polymorphic Event"
        number: 105
        properties:
          property:
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_SEVT
        name: "Simple Event"
        number: 106
        properties:
          property:
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_NLEVT
        name: "Non Local Event"
        number: 107
        properties:
          property:
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
            - name: PolySMEvt_Id
              type: REFERENCE
      - key_letter: CIM_LEVT
        name: "Local Event"
        number: 108
        properties:
          property:
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
            - name: Txn_Id
              type: REFERENCE
            - name: SMStt_Id
              type: REFERENCE
      - key_letter: CIM_TXNC
        name: "Transition Cell"
        number: 109
        properties:
          property:
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_SMCHN
        name: "Can't  Happen Cell"
        number: 110
        properties:
          property:
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_SMIGN
        name: "Ignore Cell"
        number: 111
        properties:
          property:
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_NTXN
        name: "Normal Transition"
        number: 112
        properties:
          property:
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
            - name: Txn_Id
              type: REFERENCE
              identity: [1]
            - name: DestinationSMStt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_CRTXN
        name: "Creation Transition"
        number: 113
        properties:
          property:
            - name: Txn_Id
              type: REFERENCE
              identity: [1]
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_NETXN   # depricated ?
        name: "NE Transition"
        number: 199
        properties:
          property:
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
            - name: Txn_Id
              type: REFERENCE
              identity: [1]
            - name: DestinationSMStt_Id
              type: REFERENCE
              identity: [1]
      # Operation and Function
      - key_letter: CIM_EE
        name: "External Entity"
        number: 200
        properties:
          property:
            - name: EE_Id
              type: UNIQUE_ID
              identity: [1]
            - name: DomainName
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
      - key_letter: CIM_COP
        name: "Conceptual Class Operation"
        number: 201
        properties:
          property:
            - name: CCO_Id
              type: UNIQUE_ID
              identity: [1]
            - name: DomainName
              type: REFERENCE
              identity: [2]
            - name: CClassName
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
      - key_letter: CIM_CDF
        name: "Conceptual Domain Function"
        number: 202
        properties:
          property:
            - name: CDF_Id
              type: UNIQUE_ID
              identity: [1]
            - name: DomainName
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
      - key_letter: CIM_BRG
        name: "Bridge Function"
        number: 203
        properties:
          property:
            - name: BRG_Id
              type: UNIQUE_ID
              identity: [1]
            - name: EE_Id
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
      - key_letter: CIM_DFP
        name: "Data Flow Parameter"
        number: 204
        properties:
          property:
            - name: DFP_Id
              type: UNIQUE_ID
              identity: [1]
            - name: DT_Id
              type: REFERENCE
            - name: InOrOut # True=In, False=Out
              type: BOOLEAN
      - key_letter: CIMCOPPRM
        name: "Conceptual Class Operation Parameter"
        number: 205
        properties:
          property:
            - name: CCO_Id
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: DFP_Id
              type: REFERENCE
              identity: [2]
      - key_letter: CIMM_DFPRM
        name: "Domain Function Parameter"
        number: 206
        properties:
          property:
            - name: CDF_Id
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: DFP_Id
              type: REFERENCE
              identity: [2]
      - key_letter: CIM_BRGPRM
        name: "Bridge Function Parameter"
        number: 207
        properties:
          property:
            - name: BRG_Id
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: DFP_Id
              type: REFERENCE
              identity: [2]
      # Action Model
      - key_letter: CIM_AH
        name: "Action Home"
        number: 300
        properties:
          property:
            - name: AH_Id
              type: UNIQUE_ID
              identity: [1]
            - name: ActionDescription
              type: STRING
      - key_letter: CIM_POAH
        name: "Parameter of Action Home"
        number: 301
        properties:
          property:
            - name: AH_Id
              type: REFERENCE
              identity: [1]
            - name: DFP_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_SEAH
        name: "State Entry Action Home"
        number: 302
        properties:
          property:
            - name: AH_Id
              type: REFERENCE
              identity: [1]
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_CCOAH
        name: "Conceptual Class Operation Action Home"
        number: 303
        properties:
          property:
            - name: AH_Id
              type: REFERENCE
              identity: [1]
            - name: CCO_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_CDFAH
        name: "Conceptual Domain Function Action Home"
        number: 304
        properties:
          property:
            - name: AH_Id
              type: REFERENCE
              identity: [1]
            - name: CDF_Id
              type: REFERENCE
              identity: [1]
      # Instance Model
      - key_letter: CIMI_FOS
        name: "Field of Sense"
        number: 1000
        properties:
          property:
            - name: FoS_Id
              type: UNIQUE_ID
              identity: [1, 2]
            - name: DomanName
              type: REFERENCE
              identity: [2]
      - key_letter: CIMI_INST
        name: "Instance"
        number: 1001
        properties:
          property:
            - name: FoS_Id
              type: REFERENCE
              identity: [2]
            - name: DomainName
              type: REFERENCE
              identity: [2]
            - name: CClassName
              type: REFERENCE
              identity: [2]
            - name: INST_Id
              type: UNIQUE_ID
              identity: [1, 2]
      - key_letter: "Instance Property"
        name: "Instanced Property"
        number: 1002
        properties:
          property:
            - name: IPR_Id
              type: UNIQUE_ID
              identity: [2, 3]
            - name: FoS_Id
              type: REFERENCE
              identity: [1]
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: PropertyName
              type: REFERENCE
              identity: [1]
            - name: value
              type: OTHER
            - name: INST_Id
              type: REFERENCE
              identity: [1,2]
      - key_letter: CIMI_SMI
        name: "State Machine"
        number: 1003
        properties:
          property:
            - name: FoS_Id
              type: REFERENCE
              identity: [2]
            - name: DomainName
              type: REFERENCE
              identity: [2]
            - name: CClassName
              type: REFERENCE
              identity: [2]
            - name: INST_Id
              type: REFERENCE
              identity: [1,2]
      - key_letter: CIMI_CSOI
        name: "Current State of Instance"
        number: 1004
        properties:
          property:
            - name: FoS_Id
              type: REFERENCE
              identity: [1]
            - name: DomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: INST_Id
              type: REFERENCE
              identity: [1, 2]
            - name: StateName
              type: REFERENCE
              identity: [1]
      - key_letter: CIMI_EVTI
        name: "Event Instance"
        number: 1005
        properties:
          property:
            - name: EVTI_Id
              type: UNIQUE_ID
              identity: [1,2]
            - name: SMEvt_Id
              type: REFERENCE
              identity: [2]
            - name: INST_Id
              type: REFERENCE
      - key_letter: CIMI_EISI
        name: "Instanced Supplemental Item"
        number: 1006
        properties:
          property:
            - name: EVTI_Id
              type: REFERENCE
              identity: [1]
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
            - name: ItemName
              type: REFERENCE
              identity: [1]
            - name: value
              type: OTHER
      - key_letter: CIMI_SEVTI
        name: "Self Event Instance"
        number: 1007
        properties:
          property:
            - name: EVTI_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIMI_OEVTI
        name: "Outcome Event Instance"        
        number: 1008
        properties:
          property:
            - name: EVTI_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIMI_ISTT
        name: "Intermediate State"
        number: 1009
        properties:
          property:
            - name: INST_Id
              type: REFERENCE
              identity: [1]
            - name: Consuming_EVTI_Id
              type: REFERENCE
      - key_letter: CIMI_CSTT
        name: "Committed State"
        number: 1010
        properties:
          property:
            - name: INST_Id
              type: REFERENCE
              identity: [1]
  relationships:
    relationship:
      - index: R1
        kind: binary
        referent:
          cclass: CIM_CD
          multiplicity: "1"
          phrase: "is meaningful within"
        participant:
          cclass: CIM_CC
          multiplicity: "M"
          phrase: "is FoS of"
        referencing:
          - Name: DomainName
      - index: R2
        kind: binary
        referent:
          cclass: CIM_CD
          multiplicity: "1"
          phrase: "is meaningful within"
        participant:
          cclass: CIM_REL
          multiplicity: "MC"
          phrase: "is FoS of"
        referencing:
          - Name: DomainName
      - index: R3
        kind: binary
        referent:
          cclass: CIM_CC
          multiplicity: "1"
          phrase: "define the characteristic of"
        participant:
          cclass: CIM_PR
          multiplicity: "M"

# yaml-language-server: $schema: ../schema/cim.schema.yaml
# comceptual modeling metamodel definition

domain:
  name: "metamodel of conceptual model"
  cclasses:
    # Conceptual Model
    # diagram: ./images/meta-model-cim-domain-cclass.svg
    # diagram: ./images/meta-model-cim-relationship.svg
    cclass:
      - key_letter: CIM_CD
        name: "Conceptual Domain"
        number: 0
        properties:
          property:
            - name: Name
              type: STRING
              identity: [1]
              denote: true
            - name: Description
              type: STRING
      - key_letter: CIM_CC
        name: "Conceptual Class"
        number: 1
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1,2,3]
            - name: Name
              type: STRING
              identity: [1]
              denote: true
            - name: KeyLetter
              type: STRING
              identity: [2]
            - name: Number
              type: STRING
              identity: [3]
            - name: Description
              type: STRING
      - key_letter: CIM_PR
        name: "Property"
        number: 2
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
              denote: true
            - name: Description
              type: STRING
            - name: DataTypeName
              type: REFERENCE
      - key_letter: CIM_REL
        name: "Relationships"
        number: 3
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1,2]
            - name: Index
              type: STRING
              identity: [1]
              mathematical: true
            - name: Number
              type: INTEGER
              identity: [2]
      - key_letter: CIM_DT
        name: "Data Type"
        number: 4
        properties:
          property:
            - name: DT_Id
              type: UNIQUE_ID
              identity: [1]
            - name: Name
              type: STRING
              identity: [2]
              denote: true
            - name: CDomainName
              type: REFERENCE
              identity: [2]
            - name: Grammar
              type: STRING
            - name: Description
              type: STRING
      - key_letter: CIM_ID
        name: "Identity"
        number: 5
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: Level
              type: INTEGER
              identity: [1]
      - key_letter: CIM_BPR
        name: "Base Property"
        number: 6
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: PropertyName
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_RPR
        name: "Reference Property"
        number: 7
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: PropertyName
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_ISR
        name: "is-a Relationship"
        number: 8
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: Index
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_BR
        name: "Binary Relationship"
        number: 9
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: Index
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_AR
        name: "Associative Relationship"
        number: 10
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: Index
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_CIR
        name: "CClass in Relationship"
        number: 11
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_RIR
        name: "Referent in Relationship"
        number: 12
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_PIR
        name: "Participant in Relationship"
        number: 13
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
            - name: Level
              type: REFERENCE
      - key_letter: CIM_CPID
        name: "Property in CClass Identity"
        number: 14
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: PropertyName
              type: REFERENCE
              identity: [1]
            - name: Level
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_IPIR
        name: "Identity Property in Relationship"
        number: 15
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
            - name: PropertyName
              type: REFERENCE
              identity: [1]
            - name: Level
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_REF
        name: "Reference"
        number: 16
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
            - name: PropertyName
              type: REFERENCE
              identity: [1]
            - name: Level
              type: REFERENCE
              identity: [1]
            - name: RefCClassName
              type: REFERENCE
            - name: RefPropertyName
              type: REFERENCE
      - key_letter: CIM_SRIR
        name: "Super RIR"
        number: 17
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_FRIR
        name: "Form RIR"
        number: 18
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
            - name: Multiplicity
              type: STRING
            - name: Conditionality
              type: BOOLEAN
            - name: TextPhrase
              type: STRING
      - key_letter: CIM_BFRIR
        name: "Binary Form RIR"
        number: 19
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_ONRIR
        name: "One RIR"
        number: 20
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_OTRIR
        name: "Other RIR"
        number: 21
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_SPIR
        name: "Sub PIR"
        number: 22
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_PPIR
        name: "Part PIR"
        number: 23
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
            - name: Multiplicity
              type: STRING
            - name: Conditionality
              type: BOOLEAN
            - name: TextPhrase
              type: STRING
      - key_letter: CIM_APIR
        name: "Associative PIR"
        number: 24
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: RIndex
              type: REFERENCE
              identity: [1]
      # Data Type
      # Diagram: ./images/meta-model-cim-data-type.svg
      - key_letter: CIM_BDT
        name: "Base Data Type"
        number: 30
        properties:
          property:
            - name: DT_Id
              type: UNIQUE_ID
              identity: [1]
      - key_letter: CIM_RDT
        name: "Reference Data Type"
        number: 31
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
            - name: Refering_DT_Id
              type: REFERENCE
      - key_letter: CIM_UDT
        name: "User Data Type"
        number: 32
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
            - name: UnitName
              type: STRING
            - name: Base_DT_Id
              type: REFERENCE
      - key_letter: CIM_EDT
        name: "Enumerated Data Type"
        number: 33
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_EDTI
        name: "Enumerated Data Type Item"
        number: 34
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
              denote: true
            - name: Description
              type: STRING
      - key_letter: CIM_SDT
        name: "Structured Data Type"
        number: 35
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_SDTI
        name: "Structured Data Type Item"
        number: 36
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: Item_DT_Id
              type: REFERENCE
            - name: Description
              type: STRING
              denote: true
      - key_letter: CIM_CIRDT
        name: "CClass Instance Reference Data Type"
        number: 37
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassKeyLetter
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_EIRDT
        name: "Event Instance Reference Data Type"
        number: 38
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
            - name: Event_SM_Id
              type: REFERENCE
              identity: [1]
            - name: Event_Label
              type: REFERENCE
              identity: [1]
            - name: Event_Number
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_SODT
        name: "Set of Data Type"
        number: 39
        properties:
          property:
            - name: DT_Id
              type: REFERENCE
              identity: [1]
            - name: Element_DT_Id
              type: REFERENCE
              identity: [1]
      # State Model
      # Diagram: ./images/meta-model-state-model.svg
      - key_letter: CIM_SM
        name: "State Model"
        number: 100
        properties:
          property:
            - name: SM_Id
              type: UNIQUE_ID
              identity: [1, 3]
            - name: CDomainName
              type: REFERENCE
              identity: [2, 3]
            - name: CClassName
              type: REFERENCE
              identity: [2, 3]
      - key_letter: CIM_STT
        name: "State"
        number: 101
        properties:
          property:
            - name: SMStt_Id
              type: UNIQUE_ID
              identity: [1]
            - name: SM_Id
              type: REFERENCE
              identity: [2,3]
            - name: Number
              type: INTEGER
              identity: [2]
            - name: Name
              type: STRING
              identity: [3]
              denote: true
            - name: Description
              type: STRING
            - name: FinalState
              type: BOOLEAN
      - key_letter: CIM_SMEVT
        name: "Event"
        number: 102
        properties:
          property:
            - name: SMEvt_Id
              type: UNIQUE_ID
              identity: [1]
            - name: SM_Id
              type: REFERENCE
              identity: [2,3]
            - name: Label
              type: STRING
              identity: [2]
              mathematical: true
              denote: true
            - name: Number
              type: INTEGER
              identity: [2]
            - name: Meaning
              type: STRING
              identity: [3]
            - name: DelayTime
              type: TIMESPAN
            - name: Description
              type: STRING
      - key_letter: CIM_TXN
        name: "Transition"
        number: 103
        properties:
          property:
            - name: Txn_Id
              type: UNIQUE_ID
              identity: [1]
            - name: SM_Id
              type: REFERENCE
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_EVTDI
        name: "Event Supplemental Data Item"
        number: 104
        properties:
          property:
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
              denote: true
            - name: DT_Id
              type: REFERENCE
            - name: Description
              type: STRING
      - key_letter: CIM_PEVT
        name: "Polymorphic Event"
        number: 105
        properties:
          property:
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_SEVT
        name: "Simple Event"
        number: 106
        properties:
          property:
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_NLEVT
        name: "Non Local Event"
        number: 107
        properties:
          property:
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
            - name: PolySMEvt_Id
              type: REFERENCE
      - key_letter: CIM_LEVT
        name: "Local Event"
        number: 108
        properties:
          property:
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
            - name: Txn_Id
              type: REFERENCE
            - name: SMStt_Id
              type: REFERENCE
      - key_letter: CIM_TXNC
        name: "Transition Cell"
        number: 109
        properties:
          property:
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_SMCHN
        name: "Can't  Happen Cell"
        number: 110
        properties:
          property:
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_SMIGN
        name: "Ignore Cell"
        number: 111
        properties:
          property:
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_NTXN
        name: "Normal Transition"
        number: 112
        properties:
          property:
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
            - name: SMEvt_Id
              type: REFERENCE
              identity: [1]
            - name: Txn_Id
              type: REFERENCE
              identity: [1]
            - name: DestinationSMStt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_CRTXN
        name: "Creation Transition"
        number: 113
        properties:
          property:
            - name: Txn_Id
              type: REFERENCE
              identity: [1]
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_NETXN   # depricated ?
        name: "NE Transition"
        number: 199
        properties:
          property:
            - name: SMStt_Id
              type: REFERENCE
              identity: [1]
            - name: Txn_Id
              type: REFERENCE
              identity: [1]
            - name: DestinationSMStt_Id
              type: REFERENCE
              identity: [1]
      # Operation and Function
      # Diagram: ./images/meta-model-operation-function.svg
      - key_letter: CIM_EE
        name: "External Entity"
        number: 200
        properties:
          property:
            - name: EE_Id
              type: UNIQUE_ID
              identity: [1]
            - name: CDomainName
              type: REFERENCE
              identity: [2, 3]
            - name: Name
              type: STRING
              identity: [3]
              denote: true
            - name: KeyLetter
              type: STRING
              identity: [2]
            - name: Description
              type: STRING
      - key_letter: CIM_FUNC
        name: "Function"
        number: 201
        properties:
          property:
            - name: FUNC_Id
              type: UNIQUE_ID
              identity: [1]
      - key_letter: CIM_EEF
        name: "External Entity Function"
        # This is another name for BridgePoint’s Bridge
        number: 202
        properties:
          property:
            - name: FUNC_Id
              type: REFERENCE
              identity: [1]
            - name: EE_Id
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
              denote: true
            - name: Description
              type: STRING
      - key_letter: CIM_DFUNC
        name: "Domain Function"
        number: 203
        properties:
          property:
            - name: FUNC_Id
              type: REFERENCE
              identity: [1]
            - name: CDomainName
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
              denote: true
            - name: Description
              type: STRING
      - key_letter: CIM_COP
        name: "CClass Operation"
        number: 204
        properties:
          property:
            - name: FUNC_Id
              type: REFERENCE
              identity: [1]
            - name: CDomainName
              type: REFERENCE
              identity: [2]
            - name: CClassName
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
              denote: true
            - name: IsInstanceOperation
              type: BOOLEAN
              mathematical: true # true CIOP[R207], false CCOP[R207]
            - name: Description
              type: STRING
      - key_letter: CIM_FNP
        name: "Function Parameter"
        number: 205
        properties:
          property:
            - name: FUNC_Id
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
              denote: true
            - name: DataDirection
              type: BOOLEAN   # true for input, false for output
              mathematical: true
            - name: DT_Id
              type: REFERENCE
            - name: Description
              type: STRING
      - key_letter: CIM_CCOP
        name: "Class Class Operation"
        number: 206
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: Name
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_CIOP
        name: "CClass Instance Operation"
        number: 207
        properties:
          property:
            - name: CDomainName
              type: REFERENCE
              identity: [1]
            - name: CClassName
              type: REFERENCE
              identity: [1]
            - name: Name
              type: REFERENCE
              identity: [1]
      # Action Home Model
      # Diagram: ./images/meta-model-action-home-part1.svg
      # Diagram: ./images/meta-model-action-home-part2.svg
      # Diagram: ./images/meta-model-action-home-part3.svg
      - key_letter: CIM_AH
        name: "Action Home"
        number: 300
        properties:
          property:
            - name: AH_Id
              type: UNIQUE_ID
              identity: [1]
            - name: ActionDescription
              type: STRING
      - key_letter: CIM_EEFAH
        name: "External Entity Function Action Home"
        number: 301
        properties:
          property:
            - name: AH_Id
              type: REFERENCE
              identity: [1]
            - name: FUNC_Id
              type: REFERENCE
      - key_letter: CIM_CDFAH
        name: "Conceptual Domain Function Action Home"
        number: 302
        properties:
          property:
            - name: AH_Id
              type: REFERENCE
              identity: [1]
            - name: FUNC_Id
              type: REFERENCE
      - key_letter: CIM_CCOAH
        name: "Conceptual Class Operation Action Home"
        number: 303
        properties:
          property:
            - name: AH_Id
              type: REFERENCE
              identity: [1]
            - name: FUNC_Id
              type: REFERENCE
      - key_letter: CIM_SEAH
        name: "State Entry Action Home"
        number: 304
        properties:
          property:
            - name: AH_Id
              type: REFERENCE
              identity: [1]
            - name: SMStt_Id
              type: REFERENCE
      - key_letter: CIM_ACT
        name: "Action"
        number: 305
        properties:
          property:
            - name: ACT_Id
              type: UNIQUE_ID
              identity: [1, 2]
            - name: AH_Id
              type: REFERENCE
              identity: [2]
            - name: Parent_ACT_Id
              type: REFERENCE
      - key_letter: CIM_BACT
        name: "Block Action"
        number: 306
        properties:
          property:
            - name: ACT_Id
              type: REFERENCE
              identity: [1]
            - name: AH_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_PACT
        name: "Primitive Action"
        number: 307
        properties:
          property:
            - name: ACT_Id
              type: REFERENCE
              identity: [1]
            - name: AH_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_DF
        name: "Data Flow"
        number: 308
        properties:
          property:
            - name: DF_Id
              type: UNIQUE_ID
              identity: [1]
            - name: AH_Id
              type: REFERENCE
              identity: [1]
            - name: DT_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_DPN
        name: "Data Pin"
        number: 309
        properties:
          property:
            - name: DPN_Id
              type: UNIQUE_ID
              identity: [1, 2]
            - name: DT_Id
              type: REFERENCE
              identity: [2]
      - key_letter: CIM_PAR
        name: Pin Arrangement
        number: 312
        properties:
          property:
            - name: DPN_Id
              type: REFERENCE
              identity: [1]
      - key_letter: CIM_AHPAR
        name: "Action Home Pin Arrangement"
        number: 313
        properties:
          property:
            - name: DPN_Id
              type: REFERENCE
              identity: [1]
            - name: AH_Id

# yaml-language-server: $schema: ../schema/cim.schema.yaml
# Bridge for OepnEL Specification and OpenEL Platform Independent Model
# version: 2.9.1
# date: 2026-09-23
bridges:
  "BSPECPIM":
    name: "Bridge for OpenEL Device Driver Specification and OpenEL Platform Independent Model"
    cclasses:
      DKM:
        name: "Device Kind Mapping"
        number: 1
        properties:
          DeviceKindID:
            type: REFERENCE
            identity: [1]
      VM:
        name: "Vendor Mapping"
        number: 2
        properties:
          VendorID:
            type: REFERENCE
            identity: [1]
      PM:
        name: "Product Mapping"
        number: 3
        properties:
          ProductID:
            type: REFERENCE
            identity: [1]
      CM:
        name: "Component Mapping"
        number: 4
        properties:
          ComponentID:
            type: REFERENCE
            identity: [1]
      ECM:
        name: "Executing Component Mapping"
        number: 5
        properties:
          ComponentID:
            type: REFERENCE
            identity: [1]
          EquipmentID:
            type: REFERENCE
            identity: [1]
          InstanceID:
            type: REFERENCE
            identity: [1]
      SC:
        name: "Sensor Component"
        number: 6
        properties:
          ComponentID:
            type: REFERENCE
            identity: [1]
      AC:
        name: "Actuator Component"
        number: 7
        properties:
          ComponentID:
            type: REFERENCE
            identity: [1]
      DDSM:
        name: "APISetMapping"
        number: 8
        properties:
          ProductID:
            type: REFERENCE
            identity: [1]
          VendorID:
            type: REFERENCE
            identity: [1]
          namespace:
            type: REFERENCE
            identity: [1]
          name:
            type: REFERENCE
            identity: [1]
          ImplVendorID:
            type: REFERENCE
            identity: [1]
      PDTM:
        name: "Primitive Data Type Mapping"
        number: 9
        properties:
          DataTypeID:
            type: REFERENCE
            identity: [1]
          Name:
            type: REFERENCE
            identity: [1]
      EDTIM:
        name: "Enumeration Data Type Item Mapping"
        number: 10
        properties:
          DataTypeID:
            type: REFERENCE
            identity: [1]
          EDTName:
            type: REFERENCE
            identity: [1]
          ItemName:
            type: REFERENCE
            identity: [1]
      # Item & Parameter Mapping
      PF_MB:
        name: "Memory Block"
        number: 300
        properties:
          MemoryBlockID:  # MB_ID is name on CIM.
            type: UNIQUE_ID
            identity: [1]
          Length:
            type: INTEGER
            mathematical: true
          APISetID:
            type: REFERENCE
      PF_CMB:
        name: "CDT Memory Block" # "CDT MB" is name on CIM.
        number: 301
        properties:
          MemoryBlockID:  # MB_ID is name on CIM.
            type: REFERENCE
            identity: [1]
          DataTypeID:
            type: REFERENCE
      PF_IMB:
        name: "Item Memory Block" # "Item MB" is name on CIM.
        number: 302
        properties:
          MemoryBlockID:  # MB_ID is name on CIM.
            type: REFERENCE
            identity: [1]
          ItemID:
            type: REFERENCE
            identity: [2]
          componentId:
            type: REFERENCE
            identity: [2]
          parameterId:
            type: REFERENCE
            identity: [2]
      PF_PIM:
        name: "Position in Memory"
        number: 304
        properties:
          PositionInMemoryID:  # PIM_ID is name on CIM.
            type: UNIQUE_ID
            identity: [1]
          MemoryBlockID:  # MB_ID is name on CIM.
            type: REFERENCE
            identity: [2]
          OffsetInMemoryBlock:  # "OffsetInMB" is name on CIM.
            type: INTEGER
            identity: [2]
          PositionInBits:
            type: INTEGER
            identity: [2]
      PF_CPIM:
        name: "CDTI Position in Memory" # "CDTI PIM" is name on CIM.
        number: 305
        properties:
          PositionInMemoryID:  # PIM_ID is name on CIM.
            type: REFERENCE
            identity: [1]
          DataTypeID:
            type: REFERENCE
          Name:
            type: REFERENCE
      PF_PPIM:
        name: "Parameter Position in Memory" # "Param PIM" is name on CIM.
        number: 306
        properties:
          PositionInMemoryID:  # PIM_ID is name on CIM.
            type: REFERENCE
            identity: [1]
          ItemID:
            type: REFERENCE
          Name:
            type: REFERENCE
      PF_ISO:
        name: "Item Specification Order"
        number: 303
        properties:
          ItemID:
            type: REFERENCE
            identity: [1]
          Prev_Name:
            type: REFERENCE
            identity: [1]
          Next_Name:
            type: REFERENCE
            identity: [1]
      PF_IPO:
        name: "Parameter Specification Order"
        number: 307
        properties:
          ItemID:
            type: REFERENCE
            identity: [1]
          Prev_ParamName:
            type: REFERENCE
            identity: [1]
          Next_ParamName:
            type: REFERENCE
            identity: [1]
      PF_CDTIO:
        name: "CDT Item Order"
        number: 308
        properties:
          DataTypeID:
            type: REFERENCE
            identity: [1]
          Prev_Name:
            type: REFERENCE
            identity: [1]
          Next_Name:
            type: REFERENCE
            identity: [1]
    relationships:
      R1:
        kind: "binary"
        referent:
          cclass: CM
          multiplicity: "1"
          phrase: "is execution mapping of"
        participant:
          cclass: ECM
          multiplicity: "MC"
          phrase: "is mapping base of"
        referencing:
          - ComponentID: ComponentID
      # Item & Parameter Order Mapping
      R301:
        kind: binary
        referent:
          cclass: PF_MB
          multiplicity: "1"
          phrase: "are arranged in"
        participant:
          cclass: PF_PIM
          multiplicity: "M"
          phrase: "is filled in"
        referencing:
          - MemoryBlockID: MemoryBlockID
      R300:
        kind: is-a
        referent:
          cclass: PF_MB
          properties:
            - MemoryBlockID
        participants:
          - cclass: PF_CMB
            properties:
              - MemoryBlockID
          - cclass: PF_IMB
            properties:
              - MemoryBlockID
      R302:
        kind: is-a
        referent:
          cclass: PF_PIM
          properties:
            - PositionInMemoryID
        participants:
          - cclass: PF_CPIM
            properties:
              - PositionInMemoryID
          - cclass: PF_PPIM
            properties:
              - PositionInMemoryID
    functors:
      F1:
        kind: "binary-associative"
        one:
          pclass: OpenEL:SPC:OE_DK
          multiplicity: "1"
        other:
          pclass: OpenEL:PIM:DK
          multiplicity: "1"
        associative:
          cclass: DKM
        referencing:
          one:
            - DeviceKindId: DeviceKindID
          other:
            - deviceKindId: DeviceKindID
      F2:
        kind: "binary-associative"
        one:
          pclass: OpenEL:SPC:OE_V
          multiplicity: "1"
        other:
          pclass: OpenEL:PIM:V
          multiplicity: "1"
        associative:
          cclass: VM
        referencing:
          one:
            - VendorId: VendorID
          other:
            - vendorId: VendorID
      F3:
        kind: "binary-associative"
        one:
          pclass: OpenEL:SPC:OE_P
          multiplicity: "1"
        other:
          pclass: OpenEL:PIM:P
          multiplicity: "1"
        associative:
          cclass: PM
        referencing:
          one:
            - ProductId: ProductID
          other:
            - productId: ProductID
      F4:
        kind: "binary-associative"
        one:
          pclass: OpenEL:SPC:OE_TPD
          multiplicity: "1"
        other:
          pclass: OpenEL:PIM:APIS
          multiplicity: "MC"
        associative:
          cclass: DDSM
        referencing:
          one:
            - ProductID: ProductID
            - VendorID: VendorID
          other:
            - namespace: namespace
            - name: name
      F5:
        kind: binary
        referent:
          pclass: SPC:OE_V
          multiplicity: "1"
          # phrase: "is implemented by"
        participant:
          cclass: DDSM
          multiplicity: "MC"
          # phrase: "is impmementer of"
        referencing:
          - VendorID: ImplVendorID
      F6:
        kind: "binary-associative"
        one:
          pclass: OpenEL:SPC:OEOE_EC
          multiplicity: "MC"
        other:
          pclass: OpenEL:PIM:HALC
          multiplicity: "1"
        associative:
          cclass: ECM
        referencing:
          one:
            - ComponentID: ComponentID
            - EquipmentID: EquipmentID
          other:
            - componentId: ComponentID
            - instanceId: InstanceID
      F7:
        kind: binary
        referent:
          pclass: "SPC:OE_DDS"
          multiplicity: "1"
        participant:
          cclass: "CM"
          multiplicity: "MC"
        referencing:
          - DDSpecID: DDSpecID
      F8:
        kind: "binary-associative"
        one:
          pclass: OpenEL:SPC:OEOE_EC
          multiplicity: "MC"
        other:
          pclass: OpenEL:PIM:HALC
          multiplicity: "1"
        associative:
          cclass: ECM
        referencing:
          one:
            - InstanceID: InstanceID
            - DDSpecID: DDSpecID
            - EquipmentID: EquipmentID
          other:
            - DDSpecID: DDSpecID
            - instanceId: InstanceID
      F9:
        kind: "binary-associative"
        one:
          pclass: OpenEL:SPC:OE_DDS
          multiplicity: "1"
        other:
          pclass: OpenEL:PIM:APIS
          multiplicity: "MC"
        associative:
          cclass: DDSM
        referencing:
          one:
            - DDSpecID: DDSpecID
          other:
            - apiId: ApiID
      F10:
        kind: "binary-associative"
        one:
          pclass: OpenEL:SPC:OE_PDT
          multiplicity: "1"
        other:
          pclass: OpenEL:PIM:DT
          multiplicity: "MC"
        associative:
          cclass: PDTM
        referencing:
          one:
            - DataTypeID: DataTypeID
          other:
            - name: Name
      F11:
        kind: "binary-associative"
        one:
          pclass: OpenEL:SPC:OE_EDTI
          multiplicity: "1"
        other:
          pclass: OpenEL:PIM:EDTIV
          multiplicity: "MC"
        associative:
          cclass: EDTIM
        referencing:
          one:
            - DataTypeID: DataTypeID
          other:
            - EDTName: EDTName
            - name: ItemName
      # Item & Parameter Order Mapping
      F300:
        kind: "binary-associative"
        one:
          pclass: OpenEL:PIM:PB
          multiplicity: "MC"
        other:
          pclass: OpenEL:SPC:OE_ITS
          multiplicity: "1"
        associative:
          cclass: PF_IMB
        referencing:
          one:
            - componentId: componentId
            - parameterId: parameterId
          other:
            - ItemID: ItemID
      F301:
        kind: binary
        referent:
          pclass: OpenEL:SPC:OE_ITS
          multiplicity: "1"
        participant:
          cclass: PF_IMB
          multiplicity: "1C"
        referencing:
          - ItemID: ItemID
      F304:
        kind: binary
        referent:
          pclass: OpenEL:SPC:OE_PS
          multiplicity: "1"
        participant:
          cclass: PF_PPIM
          multiplicity: "1C"
        referencing:
          - ItemID: ItemID
          - Name: Name
      F303:
        kind: binary
        referent:
          pclass: OpenEL:SPC:OE_CDT
          multiplicity: "1"
        participant:
          cclass: PF_CMB
          multiplicity: "1C"
        referencing:
          - DataTypeID: DataTypeID
      F306:
        kind: binary
        referent:
          pclass: OpenEL:SPC:OE_CDTI
          multiplicity: "1"
        participant:
          cclass: PF_CPIM
          multiplicity: "1C"
        referencing:
          - Parent_DataTypeID: DataTypeID
          - Name: Name
      F302:
        kind: "binary-associative"
        one:
          pclass: OpenEL:SPC:OE_ITS
          multiplicity: "1C"
        other:
          pclass: OpenEL:SPC:OE_ITS
          multiplicity: "1C"
        associative:
          cclass: PF_ISO
        referencing:
          one:
            - ItemID: ItemID
            - Name: Prev_Name
          other:
            - ItemID: ItemID
            - Name: Next_Name
      F305:
        kind: "binary-associative"
        one:
          pclass: OpenEL:SPC:OE_PS
          multiplicity: "1C"
        other:
          pclass: OpenEL:SPC:OE_PS
          multiplicity: "1C"
        associative:
          cclass: PF_IPO
        referencing:
          one:
            - ItemID: ItemID
            - Name: Prev_ParamName
          other:
            - ItemID: ItemID
            - Name: Next_ParamName
      F307:
        kind: "binary-associative"
        one:
          pclass: OpenEL:SPC:OE_CDTI
          multiplicity: "1C"
        other:
          pclass: OpenEL:SPC:OE_CDTI
          multiplicity: "1C"
        associative:
          cclass: PF_CDTIO
        referencing:
          one:
            - DataTypeID: DataTypeID
            - Name: Prev_Name
          other:
            - DataTypeID: DataTypeID
            - Name: Next_Name

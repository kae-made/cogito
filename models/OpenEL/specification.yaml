# yaml-language-server: $schema: ../schema/cim.schema.yaml
# OepnEL Device Driver Specification

domain:
  name: "OpenEL Device Driver Specification"
  cclasses:
    cclass:
      # OpenEL::Specification Sub system
      - key_letter: OE_DK
        name: "Device Kind"
        number: 1
        properties:
          property:
            - name: DeviceKindID
              type: UNIQUE_ID
              identity: [1]
            - name: Name
              type: STRING
              identity: [2]
            - name: Description
              type: STRING
      - key_letter: OE_PD
        name: "Product"
        number: 2
        properties:
          property:
            - name: ProductID
              type: UNIQUE_ID
              identity: [1, 2]
            - name: ProductName
              type: STRING
              identity: [3]
            - name: Description
              type: STRING
            - name: VendorID
              type: REFERENCE
              identity: [1,2]
      - key_letter: OE_Vendor
        name: "Vendor"
        number: 3
        properties:
          property:
            - name: VendorID
              type: UNIQUE_ID
              identity: [1]
            - name: Name
              type: STRING
              identity: [2]
            - name: VendorShortName
              type: STRING
              identity: [3]
            - name: Description
              type: STRING
      - key_letter: OE_C
        name: "Component"
        number: 4
        properties:
          property:
            - name: ComponentID 
              type: UNIQUE_ID
              identity: [1, 2]
            - name: DeviceKindID
              type: REFERENCE
              identity: [1]
            - name: ProductID
              type: REFERENCE
              identity: [1]
            - name: VendorID
              type: REFERENCE
              identity: [1]
      - key_letter: OE_DDS
        name: "Device Driver Specification"
        number: 5
        properties:
          property:
            - name: DeviceKindID
              type: REFERENCE
              identity: [2]
            - name: ProductID
              type: REFERENCE
              identity: [2]
            - name: VendorID
              type: REAL
              identity: [2]
            - name: ComponentID
              type: REFERENCE
              identity: [1, 2]
      - key_letter: OE_SDDS
        name: "Sensor Device Driver Specification"
        number: 6
        properties:
          property:
            - name: ComponentID
              type: REFERENCE
              identity: [1]
            - name: Parent_ComponentID
              type: REFERENCE
      - key_letter: OE_ADDS
        name: "Actuator Device Driver Specification"
        number: 7
        properties:
          property:
            - name: ComponentID
              type: REFERENCE
              identity: [1]
      - key_letter: OE_VAS
        name: "Variable Specification"
        number: 8
        properties:
          property:
            - name: VariableID # "VarID" is name on CIM.
              type: UNIQUE_ID
              identity: [1]
            - name: Name
              type: STRING
              identity: [2]
            - name: ComponentID
              type: REFERENCE
              identity: [2]
            - name: Description
              type: STRING
            - name: Next_Name
              type: REFERENCE
      - key_letter: OE_OVS
        name: "Observed Variable Specification" # "Observed VS" is name on CIM.
        number: 9
        properties:
          property:
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: ComponentID
              type: REFERENCE
      - key_letter: OE_IVS
        name: "Instruct Variable Specification" # "Instruct VS" is name on CIM.
        number: 10
        properties:
          property:
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: ComponentID
              type: REFERENCE
      - key_letter: OE_ISVS
        name: "Internal State Variable Specification" # "Internal State VS" is name on CIM.
        number: 11
        properties:
          property:
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: ComponentID
              type: REFERENCE
      - key_letter: OEC_CVS
        name: "Configuration Variable Specification" # "Configuration VS" is name on CIM.
        number: 12
        properties:
          property:
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: ConfigurationID # "ConfID" is name on CIM.
              type: REFERENCE
              identity: [1]
      - key_letter: OE_EVS
        name: "Environment Variable Specification" # "Environment VS" is name on CIM.
        number: 13
        properties:
          property:
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
      - key_letter: OE_PS
        name: "Parameter Specification"
        number: 14
        properties:
          property:
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: Description
              type: STRING
            - name: DataTypeID
              type: REFERENCE
            - name: Next_Name
              type: REFERENCE
      - key_letter: OE_CF
        name: "Configuration"
        number: 15
        properties:
          property:
            - name: ConfigurationID # "ConfID" is name on CIM.
              type: UNIQUE_ID
              identity: [1]
            - name: ComponentID
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
            - name: Description
              type: STRING
      # OpenEL::Operational Equipment Sub system
      - key_letter: OEOE_EQ
        name: "Equipment"
        number: 100
        properties:
          property:
            - name: EquipmentID
              type: UNIQUE_ID
              identity: [1]
            - name: Name
              type: STRING
            - name: Description
              type: STRING
      - key_letter: OEOE_EC
        name: "Executing Component"
        number: 101
        properties:
          property:
            - name: InstanceID
              type: UNIQUE_ID
              identity: [1]
            - name: EquipmentID
              type: REFERENCE
              identity: [1]
            - name: DeviceKindID
              type: REFERENCE
            - name: VendorID
              type: REFERENCE
            - name: ProductID
              type: REFERENCE
      - key_letter: OEOE_P
        name: "Parameter"
        number: 102
        properties:
          property:
            - name: InstanceID
              type: REFERENCE
              identity: [1]
            - name: EquipmentID
              type: REFERENCE
              identity: [1]
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: Name
              type: REFERENCE
              identity: [1]
            - name: CurrentValue
              type: OTHER
            - name: Time
              type: TIMESTAMP
      # OpenEL::Specification Approvement Sub system
      - key_letter: OESA_AP
        name: "Approvement"
        number: 200
        properties:
          property:
            - name: ApprovementID  # "AppID" is name on CIM.
              type: UNIQUE_ID
              identity: [1]
            - name: ApplicationDate
              type: TIMESTAMP
            - name: ApprovalDate
              type: TIMESTAMP
            - name: AuthorizerName
              type: REFERENCE
      - key_letter: OESA_DKAP
        name: "Device Kind Approvement"
        number: 201
        properties:
          property:
            - name: ApprovementID  # "AppID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: DeviceKindID
              type: REFERENCE
            - name: Remarks
              type: STRING
      - key_letter: OESA_VAP
        name: "Vendor Approvement"
        number: 202
        properties:
          property:
            - name: ApprovementID  # "AppID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: VendorID
              type: REFERENCE
      - key_letter: OESA_PA
        name: "Product Approvement"
        number: 203
        properties:
          property:
            - name: ApprovementID  # "AppID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: ProductID
              type: REFERENCE
      - key_letter: OESA_AT
        name: "Authorizer"
        number: 204
        properties:
          property:
            - name: Name
              type: STRING
              identity: [1]
            - name: Description
              type: STRING
      # OpenEL::Data Type Sub system
      - key_letter: OE_DT
        name: "Data Type"
        number: 300
        properties:
          property:
            - name: DataTypeID
              type: UNIQUE_ID
              identity: [1]
            - name: Description
              type: STRING
      - key_letter: OE_SDT
        name: "Specific Data Type"
        number: 301
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
            - name: ComponentID
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
      - key_letter: OE_BDT
        name: "Base Data Type"
        number: 302
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [2]
            - name: NotationID
              type: REFERENCE
      - key_letter: OE_PDT
        name: "Primitive Data Type"
        number: 303
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
            - name: Base_DataTypeID
              type: REFERENCE
            - name: NotationID
              type: REFERENCE
      - key_letter: OE_EDT
        name: "Enumerated Data Type"
        number: 304
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
      - key_letter: OE_EDTI
        name: "Enumerated Data Type Item"
        number: 305
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: Description
              type: STRING
      - key_letter: OE_CDT
        name: "Composite Data Type"
        number: 306
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
      - key_letter: OE_CDTI
        name: "Composite Data Type Item"
        number: 307
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: Description
              type: STRING
            - name: Next_Name
              type: REFERENCE
      - key_letter: OE_VNR
        name: "Value Notation Rule"
        number: 308
        properties:
          property:
            - name: NotationID
              type: UNIQUE_ID
              identity: [1]
            - name: Rule
              type: STRING # regular expression for validation
            - name: Description
              type: STRING
      # OpenEL::Variable & Parameter Order Sub system
      - key_letter: OE_MB
        name: "Memory Block"
        number: 20
        properties:
          property:
            - name: MemoryBlockID  # MB_ID is name on CIM.
              type: UNIQUE_ID
              identity: [1]
            - name: Length
              type: INTEGER
              mathematical: true
      - key_letter: OE_CMB
        name: "CDT Memory Block" # "CDT MB" is name on CIM.
        number: 21
        properties:
          property:
            - name: MemoryBlockID  # MB_ID is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: DataTypeID
              type: REFERENCE
      - OE_VMB:
        name: "Variable Memory Block" # "Var MB" is name on CIM.
        number: 22
        properties:
          property:
            - name: MemoryBlockID  # MB_ID is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
      - OE_PIM:
        name: "Position in Memory"
        number: 23
        properties:
          property:
            - name: PositionInMemoryID  # PIM_ID is name on CIM.
              type: UNIQUE_ID
              identity: [1]
            - name: MemoryBlockID  # MB_ID is name on CIM.
              type: REFERENCE
              identity: [2]
            - name: OffsetInMemoryBlock  # "OffsetInMB" is name on CIM.
              type: INTEGER
              identity: [2]
            - name: PositionInBits
              type: INTEGER
              identity: [2]
      - key_letter: OE_CPIM
        name: "CDTI Position in Memory" # "CDTI PIM" is name on CIM.
        number: 24
        properties:
          property:
            - name: PositionInMemoryID  # PIM_ID is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: DataTypeID
              type: REFERENCE
            - name: Name
              type: REFERENCE
      - key_letter: OE_PPIM
        name: "Parameter Position in Memory" # "Param PIM" is name on CIM.
        number: 25
        properties:
          property:
            - name: PositionInMemoryID  # PIM_ID is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
            - name: Name
              type: REFERENCE
      # OpenEL::Calibration Sub system
      - key_letter: OEC_CB
        name: "Calibration"
        number: 400
        properties:
          property:
            - name: CalibrationID
              type: UNIQUE_ID
              identity: [1]
            - name: ComponentID
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
            - name: Description
              type: STRING
      - key_letter: OEC_CBM
        name: "Calibration with Model"
        number: 401
        properties:
          property:
            - name: CalibrationID
              type: REFERENCE
              identity: [1]
            - name: Model
              type: OTHER
      - key_letter: OEC_CBV
        name: "Calibration with Variable"
        number: 402
        properties:
          property:
            - name: CalibrationID
              type: REFERENCE
              identity: [1]
      - key_letter: OEC_CV
        name: "Calibration Variable"
        number: 403
        properties:
          property:
            - name: CalVariableID  # "CalVarID" is name on CIM.
              type: UNIQUE_ID
              identity: [1, 2, 3]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [2, 3]
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [3]
      - key_letter: OEC_CSV
        name: "Calibration Variable"
        number: 404
        properties:
          property:
            - name: CalVariableID # "CalVarID" is name on CIM.
              type: REFERENCE
              identity: [1,2,3]
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [3]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [2,3]
      - key_letter: OEC_ECSV
        name: "Environment Calibration Specification Variable"  # "Environment CSV" is name on CIM.
        number: 405
        properties:
          property:
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
      - key_letter: OEC_ICSV
        name: "Instruct State Calibration Specification Variable"  # "Instruct CSV" is name on CIM.
        number: 406
        properties:
          property:
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
      - key_letter: OEC_CEV
        name: "Caibration Expected Variable"
        number: 407
        properties:
          property:
            - name: CalVariableID # "CalVarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
      - key_letter: OEC_ECEV
        name: "Environment Calibration Expected Variable"  # "Environment CEV" is name on CIM.
        number: 408
        properties:
          property:
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
      - key_letter: OEC_OCEV
        name: "Observed Calibration Expected Variable"  # "Observed CEV" is name on CIM.
        number: 409
        properties:
          property:
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
      - key_letter: OEC_CP
        name: "Calibration Parameter"
        number: 410
        properties:
          property:
            - name: CalVariableID # "CalVarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: VariableID # "VarID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: Name
              type: REFERENCE
              identity: [1]
            - name: Value
              type: OTHER
  relationships:
    relationship:
      # OpenEL::Specification Sub system
      - index: R2
        kind: binary
        referent:
          cclass: OE_V
          multiplicity: "1"
          phrase: "is provided by"
        participant:
           cclass: OE_PD
           multiplicity: "MC"
           phrase: "provide"
        referencing:
          - VendorID: VendorID
      - index: R3
        kind: binary
        referent:
          cclass: OE_DK
          multiplicity: "1"
          phrase: "is realization for"
        participant:
           cclass: OE_C
           multiplicity: "MC" # "*"
           phrase: "is kind of"
        referencing:
          - DeviceKindID: DeviceKindID
      - index: R4
        kind: binary
        referent:
          cclass: OE_PD
          multiplicity: "1"
          phrase: "is part of"
        participant:
          cclass: OE_C
          multiplicity: "M" # "1..*"
          phrase: "is target of"
        referencing:
          - ProductID: ProductID
          - VendorID: VendorID
      - index: R5
        kind: binary
        referent:
          cclass: OE_C
          multiplicity: "1"
          phrase: "serve as the operational specification for "
        participant:
          cclass: OE_DDS
          multiplicity: "1"
          phrase: "is operated under the control of"
        referencing:
          - DeviceKindID: DeviceKindID
          - ProductID: ProductID 
          - VendorID: VendorID
          - ComponentID: ComponentID
      - index: R6
        kind: is-a
        referent:
          cclass: OE_DDS
          properties:
            - ComponentID
        participants:
          - cclass: OE_SDDS
            properties:
              - ComponentID
          - cclass: OE_ADDS
            properties:
              - ComponentID
      - index: R7
        kind: binary
        referent:
          cclass: OE_ADDS
          multiplicity: "1C"
          phrase: "may be child of"
        participant:
          cclass: OE_DDS
          multiplicity: "MC"
          phrase: "may have"
        referencing:
          - ComponentID: Parent_ComponentID
      - index: R8
        kind: binary
        referent:
          cclass: OE_DDS
          multiplicity: "1"
          phrase: "is part of"
        participant:
          cclass: OE_VAS
          multiplicity: "MC"
          phrase: "is owner of"
        referencing:
          - ComponentID: ComponentID
      - index: R9
        kind: is-a
        referent:
          cclass: OE_VAS
          properties:
            - VariableID
        participants:
          - cclass: OE_OVS
            properties:
              - VariableID
          - cclass: OE_IVS
            properties:
              - VariableID
          - cclass: OE_ISVS
            properties:
              - VariableID
          - cclass: OE_CVS
            properties:
              - VariableID
          - cclass: OE_EVS
            properties:
              - VariableID
      - index: R10
        kind: binary
        referent:
          cclass: OE_SDDS
          multiplicity: "1"
          phrase: "is specification of the observed data for" # "is the data of the observed data for" is phrase on CIM diagram.
        participant:
          cclass: OE_OVS
          multiplicity: "M"
          phrase: "provide"
        referencing:
          - ComponentID: ComponentID
      - index: R11
        kind: binary
        referent:
          cclass: OE_DDS
          multiplicity: "1"
          phrase: "is specification of the instruction data for"  # "is the instruction data for" is phrase on CIM diagram.
        participant:
          cclass: OE_IVS
          multiplicity: "M"
          phrase: "provide"
        referencing:
          - ComponentID: ComponentID
      - index: R12
        kind: binary
        referent:
          cclass: OE_VAS
          multiplicity: "1"
          phrase: "is the detail of"
        participant:
          cclass: OE_PS
          multiplicity: "M"
          phrase: "is accompanied by"
        referencing:
          - VariableID: VariableID
      - index: R13
        kind: binary
        referent:
          cclass: OE_C
          multiplicity: "1"
          phrase: "configure"
        participant:
          cclass: OE_CF
          multiplicity: "MC"
          phrase: "is target of"
        referencing:
          - ComponentID: ComponentID
      - index: R14
        kind: binary
        referent:
          cclass: OE_CF
          multiplicity: "1"
          phrase: "is supplemental value of"
        participant:
          cclass: OE_CVS
          multiplicity: "M"
          phrase: "is determined by"
        referencing:
          - ConfigurationID: ConfigurationID
      # OpenEL::Operational Equipment Sub system
      - index: R101
        kind: binary
        referent:
          cclass: OEOE_EQ
          multiplicity: "1"
          phrase: "is part of"
        participant:
          cclass: OEOE_EC
          multiplicity: "M"
          phrase: "run with"
        referencing:
          - EquipmentID: EquipmentID
      - index: R102
        kind: binary
        participant:
          cclass: OEOE_EC
          multiplicity: "MC"
          phrase: "is specification of"
        referent:
          cclass: OE_C
          multiplicity: "1"
          phrase: "is imprelemtation for"
        referencing:
          - DeviceKindID: DeviceKindID
          - VendorID: VendorID
          - ProductID: ProductID
      - index: R103
        kind: binary
        referent:
          cclass: OEOE_EC
          multiplicity: "1"
          phrase: "represent current status of"
        participant:
          cclass: OEOE_P
          multiplicity: "M"
          phrase: "run with"
        referencing:
          - InstanceID: InstanceID
          - EquipmentID: EquipmentID
      - index: R104
        kind: binary
        participant:
          cclass: OEOE_P
          multiplicity: "MC"
          phrase: "is specification of"
        referent:
          cclass: OE_PS
          multiplicity: "1"
          phrase: "is imprelemtation for"
        referencing:
          - VariableID: VariableID
      # OpenEL::Specification Approvement Sub system
      - index: R201
        kind: binary
        referent:
          cclass: OESA_AT
          multiplicity: "1"
          phrase: "is approved by"
        participant:
          cclass: OESA_AP
          multiplicity: "MC"
          phrase: "authorize"
        referencing:
          - Name: AuthorizerName
      - index: R202
        kind: is-a
        referent:
          cclass: OESA_AP
          properties:
            - ApprovementID
        participants:
          - cclass: OESA_DKAP
            properties:
              - ApprovementID
          - cclass: OESA_VAP
            properties:
              - ApprovementID
          - cclass: OESA_PA
            properties:
              - ApprovementID
      - index: R203
        kind: binary
        participant:
          cclass: OESA_DKAP
          multiplicity: "1"
          phrase: "is target of"
        referent:
          cclass: OE_DK
          multiplicity: "1"
          phrase: "approved"
        referencing:
          - DeviceKindID: DeviceKindID
      - index: R204
        kind: binary 
        participant:
          cclass: OESA_VAP
          multiplicity: "1"
          phrase: "is target of"
        referent:
          cclass: OE_V
          multiplicity: "1"
          phrase: "approved"
        referencing:
          - VendorID: VendorID
      - index: R205
        kind: binary
        participant:

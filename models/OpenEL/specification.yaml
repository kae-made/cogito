# yaml-language-server: $schema: ../schema/cim.schema.yaml
# OepnEL Device Driver Specification
# version: 2.9.1
# date: 2026-09-19
domains:
  # OpenEL Device Driver Specification definition
  "OpenEL:SPC":
    name: "OpenEL Device Driver Specification"
    datatypes:
      DataDirection:
        kind: "enumeration"
        items:
          - "Instruct"
          - "Observe"
    cclasses:
      # OpenEL::Specification Sub system
      OE_DK:
        name: "Device Kind"
        number: 1
        properties:
          property:
            - name: DeviceKindID
              type: UNIQUE_ID
              identity: [1]
              grammar: "^0x[0-9A-Fa-f]{8}$"
            - name: Name
              type: STRING
              identity: [2]
            - name: No
              type: INTEGER
              identity: [3]
            - name: Description
              type: STRING
              nullable: true
      OE_ORG:
        name: "Organization"
        number: 2
        properties:
          property:
            - name: Name
              type: STRING
              identity: [1]
            - name: ShortName
              type: STRING
              identity: [2]
            - name: Description
              type: STRING
              nullable: true
      OE_V:
        name: "Vendor"
        number: 3
        properties:
          property:
            - name: VendorID
              type: UNIQUE_ID
              identity: [1]
              grammar: "^0x[0-9A-Fa-f]{8}$"
            - name: ShortName
              type: REFERENCE
              identity: [2]
            - name: Description
              type: STRING
              nullable: true
      OE_M:
        name: "Module"
        number: 4
        properties:
          property:
            - name: ModuleID
              type: UNIQUE_ID
              identity: [1, 2]
            - name: DeviceKindID
              type: REFERENCE
              identity: [2]
            - name: ModuleName
              type: STRING
              identity: [3]
            - nane: SupplierVendorID
              type: REFERENCE
              identity: [3]
            - name: Description
              type: STRING
              nullable: true
      OE_DDS:
        name: "Device Driver Specification"
        number: 5
        properties:
          property:
            - name: DDSpecID
              type: UNIQUE_ID
              identity: [1]
            - name: ModuleID
              type: REFERENCE
              identity: [2]
            - name: SpecificationName
              type: STRING
              identity: [2]
            - name: DefinedVendorID
              type: REFERENCE
              identity: [2]
            - name: Description
              type: STRING
              nullable: true
      OE_PD:
        name: "Product"
        number: 6
        properties:
          property:
            - name: ProductID
              type: UNIQUE_ID
              identity: [1]
              grammar: "^0x[0-9A-Fa-f]{8}$"
            - name: ProductName
              type: STRING
              identity: [2]
            - name: Description
              type: STRING
              nullable: true
            - name: VendorID
              type: REFERENCE
              identity: [1,2]
      OE_C:
        name: "Component"
        number: 7
        properties:
          property:
            - name: ComponentID 
              type: UNIQUE_ID
              identity: [1]
            - name: DDSpecID
              type: REFERENCE
              identity: [2]
            - name: ProductID
              type: REFERENCE
              identity: [2]
            - name: DefinedVendorID
              type: REFERENCE
              identity: [2]
      OE_ITS:
        name: "Item Specification"
        number: 8
        properties:
          property:
            - name: ItemID
              type: UNIQUE_ID
              identity: [1]
            - name: Name
              type: STRING
              identity: [2]
            - name: Description
              type: STRING
              nullable: true
            - name: DefinedVendorID
              type: REFERENCE
      OE_CF:
        name: "Configuration"
        number: 9
        properties:
          property:
            - name: ConfigurationID # "ConfID" is name on CIM.
              type: UNIQUE_ID
              identity: [1, 2]
            - name: DeviceItemID
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
            - name: Description
              type: STRING
              nullable: true
      OE_DIS:
        name: "Device Item Specification"
        number: 10
        properties:
          property:
            - name: ItemID
              type: REFERENCE
              identity: [1]
            - name: DeviceKindID
              type: REFERENCE
            - name: Direction
              type: DataDirection
              mathematical: true
            - name: Description
              type: STRING
              nullable: true
      OE_ISIS:
        name: "Internal State Item Specification" # "Internal State IS" is name on CIM.
        number: 11
        properties:
          property:
            - name: ItemID
              type: REFERENCE
              identity: [1]
            - name: DeviceItemID
              type: REFERENCE
      OE_CIS:
        name: "Configuration Item Specification" # "Configuration IS" is name on CIM.
        number: 12
        properties:
          property:
            - name: ItemID
              type: REFERENCE
              identity: [1]
            - name: ConfigurationID # "ConfID" is name on CIM.
              type: REFERENCE
              identity: [1]
      OE_EIS:
        name: "Environment Item Specification" # "Environment IS" is name on CIM.
        number: 13
        properties:
          property:
            - name: ItemID
              type: REFERENCE
              identity: [1]
      OE_DOIS:
        name: "Observed Item Specification" # "Observed IS" is name on CIM.
        number: 14
        properties:
          property:
            - name: ItemID
              type: REFERENCE
              identity: [1]
      OE_DIIS:
        name: "Instruct Item Specification" # "Instruct IS" is name on CIM.
        number: 15
        properties:
          property:
            - name: ItemID
              type: REFERENCE
              identity: [1]
      OE_PS:
        name: "Parameter Specification"
        number: 16
        properties:
          property:
            - name: ItemID
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: Description
              type: STRING
              nullable: true
            - name: DataTypeID
              type: REFERENCE
      OE_CFDDS:
        name: "Configuration for Device Driver Specification"
        number: 17
        properties:
          property:
            - name: ConfigurationID # "ConfID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: ComponentID
              type: REFERENCE
              identity: [1]
      OE_ITDDS:
        name: "Item Specification in DDS"
        number: 18
        properties:
          property:
            - name: ItemID
              type: REFERENCE
              identity: [1]
            - name: DDSpecID 
              type: REFERENCE
              identity: [1]
      # OpenEL::Operational Equipment Sub system
      OEOE_EQ:
        name: "Equipment"
        number: 100
        properties:
          property:
            - name: EquipmentID
              type: UNIQUE_ID
              identity: [1]
            - name: Name
              type: STRING
            - name: Description
              type: STRING
              nullable: true
      OEOE_EC:
        name: "Executing Component"
        number: 101
        properties:
          property:
            - name: InstanceID
              type: UNIQUE_ID
              identity: [1]
            - name: EquipmentID
              type: REFERENCE
              identity: [1]
            - name: DeviceKindID
              type: REFERENCE
            - name: DefinedVendorID
              type: REFERENCE
            - name: ProductID
              type: REFERENCE
            - name: ComponentID
              type: REFERENCE
      OEOE_P:
        name: "Parameter"
        number: 102
        properties:
          property:
            - name: InstanceID
              type: REFERENCE
              identity: [1]
            - name: EquipmentID
              type: REFERENCE
              identity: [1]
            - name: ItemID
              type: REFERENCE
              identity: [1]
            - name: Name
              type: REFERENCE
              identity: [1]
            - name: CurrentValue
              type: OTHER
            - name: Time
              type: TIMESTAMP
      # OpenEL::Specification Approvement Sub system
      OESA_AP:
        name: "Approvement"
        number: 200
        properties:
          property:
            - name: ApprovementID  # "AppID" is name on CIM.
              type: UNIQUE_ID
              identity: [1]
            - name: ApplicationDate
              type: TIMESTAMP
            - name: ApprovalDate
              type: TIMESTAMP
            - name: AuthorizerName
              type: REFERENCE
            - name: ApplicantName
              type: REFERENCE
            - name: Remarks
              type: STRING
      OESA_DKAP:
        name: "Device Kind Approvement"
        number: 201
        properties:
          property:
            - name: ApprovementID  # "AppID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: DeviceKindID
              type: REFERENCE
      OESA_VAP:
        name: "Vendor Approvement"
        number: 202
        properties:
          property:
            - name: ApprovementID  # "AppID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: VendorID
              type: REFERENCE
      OESA_PA:
        name: "Product Approvement"
        number: 203
        properties:
          property:
            - name: ApprovementID  # "AppID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: ProductID
              type: REFERENCE
            - name: VendorID
              type: REFERENCE
      OESA_AT:
        name: "Authorizer"
        number: 204
        properties:
          property:
            - name: ShortName
              type: REFERENCE
              identity: [1]
            - name: Description
              type: STRING
              nullable: true
      # OpenEL::Data Type Sub system
      OE_DT:
        name: "Data Type"
        number: 20
        properties:
          property:
            - name: DataTypeID
              type: UNIQUE_ID
              identity: [1]
            - name: Description
              type: STRING
              nullable: true
      OE_SDT:
        name: "Specific Data Type"
        number: 21
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
            - name: DefinedVendorID
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
      OE_BDT:
        name: "Base Data Type"
        number: 22
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [2]
            - name: NotationID
              type: REFERENCE
              nullable: true
      OE_PDT:
        name: "Primitive Data Type"
        number: 23
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
            - name: Base_DataTypeID
              type: REFERENCE
            - name: NotationID
              type: REFERENCE
              nullable: true
      OE_EDT:
        name: "Enumerated Data Type"
        number: 24
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
      OE_EDTI:
        name: "Enumerated Data Type Item"
        number: 25
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: Description
              type: STRING
              nullable: true
      OE_CDT:
        name: "Composite Data Type"
        number: 26
        properties:
          property:
            - name: DataTypeID
              type: REFERENCE
              identity: [1]
      OE_CDTI:
        name: "Composite Data Type Item"
        number: 27
        properties:
          property:
            - name: Parent_DataTypeID
              type: REFERENCE
              identity: [1]
            - name: Name
              type: STRING
              identity: [1]
            - name: DataTypeID
              type: REFERENCE
            - name: Description
              type: STRING
              nullable: true
            - name: Next_Name
              type: REFERENCE
              nullable: true
      OE_VNR:
        name: "Value Notation Rule"
        number: 28
        properties:
          property:
            - name: NotationID
              type: UNIQUE_ID
              identity: [1]
            - name: Rule
              type: STRING # regular expression for validation
            - name: Description
              type: STRING
              nullable: true
      # OpenEL::Calibration Sub system
      OEC_CB:
        name: "Calibration"
        number: 50
        properties:
          property:
            - name: CalibrationID
              type: UNIQUE_ID
              identity: [1]
            - name: ModuleID
              type: REFERENCE
              identity: [2]
            - name: DDSpecID
              type: REFERENCE
              identity: [2]
            - name: Name
              type: STRING
              identity: [2]
            - name: Description
              type: STRING
              nullable: true
      OEC_CBM:
        name: "Calibration with Model"
        number: 51
        properties:
          property:
            - name: CalibrationID
              type: REFERENCE
              identity: [1]
            - name: Model
              type: OTHER
              nullable: true
      OEC_CBI:
        name: "Calibration with Item"
        number: 52
        properties:
          property:
            - name: CalibrationID
              type: REFERENCE
              identity: [1]
      OEC_CI:
        name: "Calibration Item"
        number: 53
        properties:
          property:
            - name: CalItemID
              type: UNIQUE_ID
              identity: [1, 2, 3]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [2, 3]
            - name: ItemID
              type: REFERENCE
              identity: [3]
      OEC_CSI:
        name: "Calibration Item"
        number: 54
        properties:
          property:
            - name: CalItemID
              type: REFERENCE
              identity: [2]
            - name: ItemID
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
      OEC_ECSI:
        name: "Environment Calibration Specification Item"  # "Environment CSI" is name on CIM.
        number: 55
        properties:
          property:
            - name: ItemID
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
      OEC_ICSI:
        name: "Instruct State Calibration Specification Item"  # "Instruct CSI" is name on CIM.
        number: 56
        properties:
          property:
            - name: ItemID
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
      OEC_CEI:
        name: "Caibration Expected Item"
        number: 57
        properties:
          property:
            - name: CalItemID
              type: REFERENCE
              identity: [2]
            - name: ItemID
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
      OEC_ECEI:
        name: "Environment Calibration Expected Item"  # "Environment CEI" is name on CIM.
        number: 58
        properties:
          property:
            - name: ItemID
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
      OEC_OCEI:
        name: "Observed Calibration Expected Item"  # "Observed CEI" is name on CIM.
        number: 59
        properties:
          property:
            - name: ItemID 
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
      OEC_CP:
        name: "Calibration Parameter"
        number: 60
        properties:
          property:
            - name: CalItemID
              type: REFERENCE
              identity: [1]
            - name: CalibrationID  # "CalID" is name on CIM.
              type: REFERENCE
              identity: [1]
            - name: ItemID
              type: REFERENCE
              identity: [1]
            - name: Name
              type: REFERENCE
              identity: [1]
            - name: Value
              type: OTHER
              nullable: true
    relationships:
      # OpenEL::Specification Sub system
      R1:
        kind: binary
        referent:
          cclass: OE_ORG
          multiplicity: "1C"
          phrase: "is"
        participant:
          cclass: OE_V
          multiplicity: "1C"
          phrase: "may be"  
        referencing:
          - ShortName: ShortName
      R2:
        kind: binary
        referent:
          cclass: OE_V
          multiplicity: "1"
          phrase: "is provided by"
        participant:
           cclass: OE_PD
           multiplicity: "MC"
           phrase: "provide"
        referencing:
          - VendorID: VendorID
      R3:
        kind: binary
        referent:
          cclass: OE_DK
          multiplicity: "1"
          phrase: "is real module for"
        participant:
           cclass: OE_M
           multiplicity: "MC" # "*"
           phrase: "is kind of"
        referencing:
          - DeviceKindID: DeviceKindID
      R4:
        kind: binary
        referent:
          cclass: OE_PD
          multiplicity: "1"
          phrase: "is part of"
        participant:
          cclass: OE_C
          multiplicity: "MC" # "*"
          phrase: "is target of"
        referencing:
          - ProductID: ProductID
          - VendorID: VendorID
      R5:
        kind: binary
        referent:
          cclass: OE_C
          multiplicity: "1"
          phrase: "serve as the operational specification for "
        participant:
          cclass: OE_DDS
          multiplicity: "1"
          phrase: "is operated under the control of"
        referencing:
          - DDSpecID: DDSpecID
      R6:
        kind: binary-associative
        one:
          cclass: OE_DDS
          multiplicity: "MC"
          phrase: "is detaile of"
        other:
          cclass: OE_DIS
          multiplicity: "1"
          phrase: "use as part of"
        associative:
          cclass: OE_ITDDS
        referencing:
          one:
            - DDSpecID: DDSpecID
          other:
            - ItemID: ItemID
      R7:
        kind: binary
        referent:
          cclass: OE_DK
          multiplicity: "1"
          phrase: "refer as kind of"
        participant:
          cclass: OE_DIS
          multiplicity: "MC"
          phrase: "is target of"
        referencing:
          - DeviceKindID: DeviceKindID
      R8:
        kind: binary
        referent:
          cclass: OE_DDS
          multiplicity: "1"
          phrase: "is part of"
        participant:
          cclass: OE_ITS
          multiplicity: "MC"
          phrase: "is owner of"
        referencing:
          - ComponentID: ComponentID
      R9:
        kind: binary
        referent:
          cclass: OE_CF
          multiplicity: "1"
          phrase: "is detail of"
        participant:
          cclass: OE_CIS
          multiplicity: "M"
          phrase: "is defined by"
        referencing:
          - ConfigurationID: ConfigurationID
      R11:
        kind: is-a
        referent:
          cclass: OE_ITS
          properties:
            - ItemID
        participants:
          - cclass: OE_OIS
            properties:
              - ItemID
          - cclass: OE_IIS
            properties:
              - ItemID
          - cclass: OE_ISIS
            properties:
              - ItemID
          - cclass: OE_CIS
            properties:
              - ItemID
          - cclass: OE_EIS
            properties:
              - ItemID
      R12:
        kind: binary
        referent:
          cclass: OE_ITS
          multiplicity: "1"
          phrase: "is the detail of"
        participant:
          cclass: OE_PS
          multiplicity: "M"
          phrase: "is accompanied by"
        referencing:
          - ItemID: ItemID
      R13:
        kind: binary
        referent:
          cclass: OE_V
          multiplicity: "1"
          phrase: "is defined by"
        participant:
          cclass: OE_ITS
          multiplicity: "MC"
          phrase: "define"
        referencing:
          - VendorID: DefinedVendorID
      R14:
        kind: is-a
        referent:
          cclass: OE_DIS
          properties:
            - ItemID
        participants:
          - cclass: OE_DOIS
            properties:
              - ItemID
          - cclass: OE_DIIS
            properties:
              - ItemID
      R15:
        kind: binary
        referent:
          cclass: OE_DIS
          multiplicity: "1"
          phrase: "represents state of"
        participant:
          cclass: OE_ISIS
          multiplicity: "MC"
          phrase: "may hold"
        referencing:
          - DeviceItemID: DeviceItemID
      R16:
        kind: binary
        referent:
          cclass: OE_V
          multiplicity: "1"
          phrase: "is supplied by"
        participant:
          cclass: OE_M
          multiplicity: "MC"
          phrase: "is manufacturer of"
        referencing:
          - VendorID: VendorID
      R17:
        kind: binary
        referent:
          cclass: OE_M
          multiplicity: "1"
          phrase: "is specification to operate"
        participant:
          cclass: OE_DDS
          multiplicity: "MC"
          phrase: "is operated via"
        referencing:
          - ModuleID: ModuleID
      R18:
        kind: binary
        referent:
          cclass: OE_V
          multiplicity: "1"
          phrase: "is specified by"
        participant:
          cclass: OE_C
          multiplicity: "MC"
          phrase: "describe details of"
        referencing:
          - VendorID: DefinedVendorID
      # OpenEL::Operational Equipment Sub system
      R101:
        kind: binary
        referent:
          cclass: OEOE_EQ
          multiplicity: "1"
          phrase: "is part of"
        participant:
          cclass: OEOE_EC
          multiplicity: "M"
          phrase: "run with"
        referencing:
          - EquipmentID: EquipmentID
      R102:
        kind: binary
        participant:
          cclass: OEOE_EC
          multiplicity: "MC"
          phrase: "is specification of"
        referent:
          cclass: OE_C
          multiplicity: "1"
          phrase: "is imprelemtation for"
        referencing:
          - DeviceKindID: DeviceKindID
          - DefinedVendorID: DefinedVendorID
          - ProductID: ProductID
          - ComponentID: ComponentID
      R103:
        kind: binary
        referent:
          cclass: OEOE_EC
          multiplicity: "1"
          phrase: "represent current status of"
        participant:
          cclass: OEOE_P
          multiplicity: "M"
          phrase: "run with"
        referencing:
          - InstanceID: InstanceID
          - EquipmentID: EquipmentID
      R104:
        kind: binary
        participant:
          cclass: OEOE_P
          multiplicity: "MC"
          phrase: "is specification of"
        referent:
          cclass: OE_PS
          multiplicity: "1"
          phrase: "is imprelemtation for"
        referencing:
          - ItemID: ItemID
          - Name: Name
      # OpenEL::Specification Approvement Sub system
      R201:
        kind: binary
        referent:
          cclass: OESA_AT
          multiplicity: "1"
          phrase: "is approved by"
        participant:
          cclass: OESA_AP
          multiplicity: "MC"
          phrase: "authorize"
        referencing:
          - ShortName: AuthorizerName
      R202:
        kind: is-a
        referent:
          cclass: OESA_AP
          properties:
            - ApprovementID
        participants:
          - cclass: OESA_DKAP
            properties:
              - ApprovementID
          - cclass: OESA_VAP
            properties:
              - ApprovementID
          - cclass: OESA_PA
            properties:
              - ApprovementID
      R203:
        kind: binary
        participant:
          cclass: OESA_DKAP
          multiplicity: "1C"
          phrase: "is target of"
        referent:
          cclass: OE_DK
          multiplicity: "1"
          phrase: "approved"
        referencing:
          - DeviceKindID: DeviceKindID
      R204:
        kind: binary 
        participant:
          cclass: OESA_VAP
          multiplicity: "1C"
          phrase: "is target of"
        referent:
          cclass: OE_V
          multiplicity: "1"
          phrase: "approved"
        referencing:
          - VendorID: VendorID
      R205:
        kind: binary
        participant:
          cclass: OESA_PA
          multiplicity: "1C"
          phrase: "is target of"
        referent:
          cclass: OE_PD
          multiplicity: "1"
          phrase: "approved"
        referencing:
          - ProductID: ProductID
          - VendorID: VendorID
      R206:

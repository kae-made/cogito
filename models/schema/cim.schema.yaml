$schema: "https://json-schema.org/draft/2020-12/schema"
title: Conceptual Information Model (CIM) Schema
description: A schema for defining a Conceptual Information Model (CIM) in a structured format
type: object

anyOf:
  - required: ["domains"]
  - required: ["bridges"]

$defs:
  # property type definition
  baseDataType:
    type: string
    enum:
      - UNIQUE_ID
      - STRING
      - INTEGER
      - REAL
      - BOOLEAN
      - TIMESTAMP
      - TIMESPAN
      - REFERENCE
      - INSTANCE
      - INSTANCE_SET
      - EVENT_INSTANCE
      - OTHER
 
  # -----------------------------
  # Primitive type
  # -----------------------------
  primitiveType:
    type: object
    required: [basetype]
    properties:
      kind:
        const: primitive
      basetype:
        $ref: '#/$defs/baseDataType'
      unit:
        type: string
      grammar:
        type: string

  # -----------------------------
  # Enumeration type
  # -----------------------------
  enumerationType:
    type: object
    required: [items]
    properties:
      kind:
        const: enumeration
      items:
        type: array
        items:
          type: string

  # -----------------------------
  # Complex type
  # -----------------------------
  complexType:
    type: object
    required: [items]
    properties:
      kind:
        const: complex
      items:
        type: object
        propertyNames:
          description: "フィールド名（最初の文字はアルファベット、2文字目以降は英数字またはアンダースコア）"
          pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
        # 💡 メンバー（追加プロパティ）のパターンをオブジェクト型に定義
        additionalProperties:
          type: object
          required: [type] # 型名は必須にします
          properties:
            type:
              type: string
              description: "基本データ型、または定義済みの特定データ型名"
            description:
              type: string
              description: "このフィールド（メンバー）の説明文"
  # -----------------------------
  # Specific Datatype
  # -----------------------------
  specificDatatype:
    type: object
    required: [kind]
    properties:
      kind:
        type: string
        enum: [enumeration, primitive, complex]
      description:
        type: string
    allOf:
      - oneOf:
          - allOf:
              - properties:
                  kind: { const: enumeration }
              - $ref: "#/$defs/enumerationType"
          - allOf:
              - properties:
                  kind: { const: primitive }
              - $ref: "#/$defs/primitiveType"
          - allOf:
              - properties:
                  kind: { const: complex }
              - $ref: "#/$defs/complexType"

  # ---------------------------------------------------------
  # type of conceptual class property
  # ---------------------------------------------------------
  propertyType:
    oneOf:
      - $ref: '#/$defs/baseDataType'
      - $ref: '#/$defs/specificDatatype'

  # ---------------------------------------------------------
  # conceptual class property structure definition
  # ---------------------------------------------------------
  classProperty:
    type: object
    required:
      - type
    properties:
      description:
        type: string
      type:
        type: string # '#/$defs/propertyType'
      identity:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 3
        uniqueItems: true
      mathematical:
        type: boolean
      grammar:
        type: string
      denote:
        type: boolean
      nullable:
        type: boolean

  # ---------------------------------------------------------
  # conceptual class structure definition
  # ---------------------------------------------------------
  cclass:
    type: object
    required:
      - name
      - number
      - properties
    properties:
      # 💡 key_letter はオブジェクトのキー（親階層）に移動したため、ここからは削除されました
      # name, number の一意性は本Schemaでは保証されないので、Parserで担保すること
      name:
        type: string
      number:
        type: integer
      description:
        type: string
      properties:
        type: object
        propertyNames:
          description: "プロパティ名（最初の文字はアルファベット、2文字目以降は英数字またはアンダースコア）"
          pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
        additionalProperties:
          $ref: '#/$defs/classProperty'

  # ---------------------------------------------------------
  # relationship schema definition
  # ---------------------------------------------------------
  relationship:
    oneOf:
      # ---------------------------------------------------------
      # 1. binary relationship
      # ---------------------------------------------------------
      - type: object
        required: ["kind", "referent", "participant", "referencing"]
        properties:
          kind:
            const: "binary"
          # binary の referent / participant
          referent:
            $ref: "#/$defs/relationshipEnd"
          participant:
            $ref: "#/$defs/relationshipEnd"
          referencing:
            type: array
            items:
              type: object
              additionalProperties:
                type: string

      # ---------------------------------------------------------
      # 2. is-a relationship
      # ---------------------------------------------------------
      - type: object
        required: ["kind", "referent", "participants"]
        properties:
          kind:
            const: "is-a"

          # is-a の referent / participants
          referent:
            $ref: "#/$defs/isAEnd"

          participants:
            type: array
            items:
              $ref: "#/$defs/isAEnd"

      # ---------------------------------------------------------
      # 3. binary-associative relationship
      # ---------------------------------------------------------
      - type: object
        required: ["kind", "one", "other", "associative", "referencing"]
        properties:
          kind:
            const: "binary-associative"
          one:
            $ref: "#/$defs/relationshipEnd"
          other:
            $ref: "#/$defs/relationshipEnd"
          associative:
            type: object
            properties:
              cclass: { type: string }
            required: ["cclass"]
          referencing:
            type: object
            properties:
              one:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
              other:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
            required: ["one", "other"]

        not:
          anyOf:
            - required: ["referent"]
            - required: ["participant"]

  # ---------------------------------------------------------
  # binary relationship end
  # ---------------------------------------------------------
  relationshipEnd:
    type: object
    properties:
      cclass: { type: string }
      multiplicity:
        type: string
        enum:
          - "1"
          - "1C"
          - "M"
          - "MC"
      phrase: { type: string }
    required: ["cclass", "multiplicity"]

  # ---------------------------------------------------------
  # is-a relationship end
  # ---------------------------------------------------------
  isAEnd:
    type: object
    properties:
      cclass: { type: string }
      properties:
        type: array
        items: { type: string }
    required: ["cclass", "properties"]

  # ---------------------------------------------------------
  # functor schema definition
  # ---------------------------------------------------------
  functor:
    oneOf:
      # ---------------------------------------------------------
      # 1. binary functor
      # ---------------------------------------------------------
      - type: object
        required: ["kind", "referent", "participant", "referencing"]
        properties:
          kind:
            const: "binary"
          # binary の referent / participant
          referent:
            $ref: "#/$defs/functorEnd"
          participant:
            $ref: "#/$defs/functorEnd"
          referencing:
            type: array
            items:
              type: object
              additionalProperties:
                type: string

      # ---------------------------------------------------------
      # 3. binary-associative functor
      # ---------------------------------------------------------
      - type: object
        required: ["kind", "one", "other", "associative", "referencing"]
        properties:
          kind:
            const: "binary-associative"
          one:
            $ref: "#/$defs/functorEnd"
          other:
            $ref: "#/$defs/functorEnd"
          associative:
            type: object
            properties:
              cclass: { type: string }
            required: ["cclass"]
          referencing:
            type: object
            properties:
              one:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
              other:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
            required: ["one", "other"]
        not:
          anyOf:
            - required: ["referent"]
            - required: ["participant"]

  # ---------------------------------------------------------
  # binary functor end
  # ---------------------------------------------------------
  functorEnd:
    type: object
    required: ["multiplicity"]
    properties:
      multiplicity:
        type: string
        enum: ["1", "1C", "M", "MC"] # 💡 共通のプロパティを外側に配置
    oneOf:
      # パターンA: cclass のみを許可（pclass は記述禁止）
      - type: object
        required: ["cclass"]
        properties:
          cclass:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
          pclass: { not: {} }
      # パターンB: pclass のみを許可（cclass は記述禁止）
      - type: object
        required: ["pclass"]
        properties:
          pclass:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*(?::[A-Za-z_][A-Za-z0-9_]*)+$"
          cclass: { not: {} }            

# main CIM structure definition
properties:
  domains:
    type: object
    propertyNames:
      description: "ドメインのキー文字（大文字のアルファベット1文字など）"
      pattern: "^[a-zA-Z0-9_]+(?::[a-zA-Z0-9_]+)*$" # 💡 例として「大文字アルファベット1文字」に制限しています
    additionalProperties:
      type: object
      required:
        - name
        - cclasses
        - relationships
      properties:
        name:
          type: string
        # 💡 ドメインのキー文字をオブジェクトのキーにしたため、内部の key_letter プロパティは不要になり削除しました
        description:
          type: string
        datatypes:
          type: object
          propertyNames:
            description: "固有のデータタイプ名（英数字・アンダースコア）"
            pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
          additionalProperties:
            $ref: '#/$defs/specificDatatype'
        cclasses:
          type: object
          propertyNames:
            description: "the key is key_letter of conceptual class"
            pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
          additionalProperties:
            $ref: '#/$defs/cclass'
        relationships:
          type: object
          propertyNames:
            description: "関連インデックス（例: R1, R2 などの関連番号）"
            pattern: "^R[1-9][0-9]*$"
          additionalProperties:
            $ref: '#/$defs/relationship'
  bridges:
    type: object
    propertyNames:
      description: "Bridge のキー文字"
      pattern: "^[a-zA-Z0-9_]+(?::[a-zA-Z0-9_]+)*$"
    additionalProperties:
      type: object
      required:
        - name
        - cclasses
        - functors 
      properties:
        name:
          type: string
        description:
          type: string
        datatypes:
          type: object
          propertyNames:
            description: "固有のデータタイプ名（英数字・アンダースコア）"
            pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
          additionalProperties:
            $ref: '#/$defs/specificDatatype'
        # conceptual class definition structure
        cclasses:
          type: object
          propertyNames:
            description: "the key is key_letter of conceptual class"
            pattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
          additionalProperties:
            $ref: '#/$defs/cclass'
        # relationship definition structure
        relationships:
          type: object
          propertyNames:
            description: "関連インデックス（例: R1, R2 などの関連番号）"
            pattern: "^R[1-9][0-9]*$" # Rから始まり、次が1〜9、その後は0〜9の数字が続く（R01などを防ぐ一般的な表現）
          additionalProperties:
            $ref: '#/$defs/relationship'
        # functor definition structure
        functors:
          type: object
          propertyNames:
            description: "関手インデックス（例: F1, F2 などの関連番号）"
            pattern: "^F[1-9][0-9]*$" # Rから始まり、次が1〜9、その後は0〜9の数字が続く（R01などを防ぐ一般的な表現）
          additionalProperties:
            $ref: '#/$defs/functor'

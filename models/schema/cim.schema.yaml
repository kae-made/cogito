$schema: "https://json-schema.org/draft/2020-12/schema"
title: Conceptual Information Model (CIM) Schema
description: A schema for defining a Conceptual Information Model (CIM) in a structured format
type: object
required:
  - domain

$defs:
  # property type definition
  baseDataType:
    type: string
    enum:
      - UNIQUE_ID
      - STRING
      - INTEGER
      - REAL
      - BOOLEAN
      - TIMESTAMP
      - TIMESPAN
      - REFERENCE
      - INSTANCE
      - INSTANCE_SET
      - EVENT_INSTANCE
      - OTHER
 
  # -----------------------------
  # Primitive type
  # -----------------------------
  primitiveType:
    type: object
    required: [basetype]
    properties:
      kind:
        const: primitive
      basetype:
        $ref: '#/$defs/baseDataType'
      unit:
        type: string
      grammar:
        type: string

  # -----------------------------
  # Enumeration type
  # -----------------------------
  enumerationType:
    type: object
    required: [items]
    properties:
      kind:
        const: enumeration
      items:
        type: array
        items:
          type: string

  # -----------------------------
  # Complex type
  # -----------------------------
  complexType:
    type: object
    required: [items]
    properties:
      kind:
        const: complex
      items:
        type: array
        items:
          type: object
          required: [name, type]
          properties:
            name:
              type: string
            type:
              type: string

  # -----------------------------
  # Specific Datatype
  # -----------------------------
  specificDatatype:
    type: object
    required: [name, kind]
    properties:
      name:
        type: string
      kind:
        type: string
        enum: [enumeration, primitive, complex]
      description:
        type: string
    allOf:
      - oneOf:
          - allOf:
              - properties:
                  kind: { const: enumeration }
              - $ref: "#/$defs/enumerationType"
          - allOf:
              - properties:
                  kind: { const: primitive }
              - $ref: "#/$defs/primitiveType"
          - allOf:
              - properties:
                  kind: { const: complex }
              - $ref: "#/$defs/complexType"

  # ---------------------------------------------------------
  # type of class property
  # ---------------------------------------------------------
  propertyType:
    oneOf:
      - $ref: '#/$defs/baseDataType'
      - $ref: '#/$defs/specificDatatype'

  # ---------------------------------------------------------
  # class property structure definition
  # ---------------------------------------------------------
  classProperty:
    type: object
    required:
      - name
      - type
    properties:
      name:
        type: string
      description:
        type: string
      type:
        $ref: '#/$defs/propertyType'
      identity:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 3
        uniqueItems: true
      mathematical:
        type: boolean
      grammar:
        type: string
  
  # ---------------------------------------------------------
  # class structure definition
  # ---------------------------------------------------------
  class:
    type: object
    required:
      - key_letter
      - name
      - number
      - properties
    properties:
      key_letter:
        type: string
      name:
        type: string
      number:
        type: integer
      description:
        type: string
      properties:
        type: object
        properties:
          property:
            type: array
            items:
              $ref: '#/$defs/classProperty'
        required:
          - property

  # ---------------------------------------------------------
  # relationship schema definition
  # ---------------------------------------------------------
  relationship:
    oneOf:
      # ---------------------------------------------------------
      # 1. binary relationship
      # ---------------------------------------------------------
      - type: object
        required: ["index", "kind", "referent", "participant", "referencing"]
        properties:
          index:
            type: string
          kind:
            const: "binary"
          # binary の referent / participant
          referent:
            $ref: "#/$defs/relationshipEnd"
          participant:
            $ref: "#/$defs/relationshipEnd"
          referencing:
            type: array
            items:
              type: object
              additionalProperties:
                type: string

      # ---------------------------------------------------------
      # 2. is-a relationship
      # ---------------------------------------------------------
      - type: object
        required: ["index", "kind", "referent", "participants"]
        properties:
          index:
            type: string

          kind:
            const: "is-a"

          # is-a の referent / participants
          referent:
            $ref: "#/$defs/isAEnd"

          participants:
            type: array
            items:
              $ref: "#/$defs/isAEnd"

      # ---------------------------------------------------------
      # 3. binary-associative relationship
      # ---------------------------------------------------------
      - type: object
        required: ["index", "kind", "one", "other", "associative", "referencing"]
        properties:
          index:
            type: string
          kind:
            const: "binary-associative"
          one:
            $ref: "#/$defs/relationshipEnd"
          other:
            $ref: "#/$defs/relationshipEnd"
          associative:
            type: object
            properties:
              cclass: { type: string }
            required: ["cclass"]
          referencing:
            type: object
            properties:
              one:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
              other:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
            required: ["one", "other"]

        not:
          anyOf:
            - required: ["referent"]
            - required: ["participant"]

  # ---------------------------------------------------------
  # binary relationship end
  # ---------------------------------------------------------
  relationshipEnd:
    type: object
    properties:
      cclass: { type: string }
      multiplicity:
        type: string
        enum:
          - "1"
          - "1C"
          - "M"
          - "MC"
      phrase: { type: string }
    required: ["cclass", "multiplicity"]


  # ---------------------------------------------------------
  # is-a relationship end
  # ---------------------------------------------------------
  isAEnd:
    type: object
    properties:
      cclass: { type: string }
      properties:
        type: array
        items: { type: string }
    required: ["cclass", "properties"]

# main CIM structure definition
properties:
  domain:
    type: object
    required:
      - name
      - classes
      - relationships
    properties:
      name:
        type: string
      description:
        type: string
      datatypes:
        type: object
        required: [datatype]
        properties:
          datatype:
            type: array
            items:
              $ref: '#/$defs/specificDatatype'
      # class definition structure
      classes:
        type: object
        required:
          - class
        properties:
          class:
            type: array
            uniqueItems: true
            uniqueItemProperties:
              - key_letter
              - name
              - number
            items:
              $ref: '#/$defs/class'
      # relationship definition structure
      relationships:
        type: object
        required:
          - relationship
        properties:
          relationship:
            type: array
            items:
              $ref: '#/$defs/relationship'

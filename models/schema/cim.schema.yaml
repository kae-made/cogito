$schema: "https://json-schema.org/draft/2020-12/schema"
title: Conceptual Information Model (CIM) Schema
description: A schema for defining a Conceptual Information Model (CIM) in a structured format
type: object
required:
  - domain

$defs:
  # property type definition
  propertyType:
    type: string
    enum:
      - UNIQUE_ID
      - STRING
      - INTEGER
      - REAL
      - BOOLEAN
      - TIMESTAMP
      - OTHER
 
  # ---------------------------------------------------------
  # class property structure definition
  # ---------------------------------------------------------
  classProperty:
    type: object
    required:
      - type
    properties:
      type:
        $ref: '#/$defs/propertyType'
      identity:
        type: array
        items:
          type: integer
          minimum: 1
          maximum: 3
        uniqueItems: true
      matematical:
        type: boolean
  
  # ---------------------------------------------------------
  # class structure definition
  # ---------------------------------------------------------
  class:
    type: object
    required:
      - key_letter
      - name
      - number
      - properties
    properties:
      key_letter:
        type: string
      name:
        type: string
      number:
        type: integer
      properties:
        type: object
        additionalProperties:
          $ref: '#/$defs/classProperty'

  # ---------------------------------------------------------
  # relationship schema definition
  # ---------------------------------------------------------
  relationship:
    type: object
    required: ["index", "kind"]
    properties:
      index:
        type: string

      kind:
        type: string
        enum: ["binary", "is-a"]

      # --- binary relationship ---
      one:
        $ref: "#/$defs/relationshipEnd"

      other:
        $ref: "#/$defs/relationshipEnd"

      referencing:
        oneOf:
          # usual referencing: [ { key: key }, ... ]
          - type: array
            items:
              type: object
              additionalProperties:
                type: string

          # special referencing for associative class: { key: value, ... }
          # referencing:
          #   one:
          #     - CalibrationID: CalibrationID
          #   other:
          #     - VariableID: VariableID
          - type: object
            properties:
              one:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
              other:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
            required: ["one", "other"]

      # --- associative relationship (extension of binary) ---
      associative:
        type: object
        properties:
          cclass: { type: string }
        required: ["cclass"]

      # --- is-a relationship ---
      referent:
        $ref: "#/$defs/isAEnd"

      participant:
        type: array
        items:
          $ref: "#/$defs/isAEnd"

    oneOf:
      # 1. binary
      - required: ["one", "other", "referencing"]

      # 2. binary + associative
      - required: ["one", "other", "referencing", "associative"]

      # 3. is-a
      - required: ["referent", "participant"]


  # ---------------------------------------------------------
  # binary relationship end
  # ---------------------------------------------------------
  relationshipEnd:
    type: object
    properties:
      cclass: { type: string }
      multiplicity: { type: string }
      phrase: { type: string }
    required: ["cclass", "multiplicity"]


  # ---------------------------------------------------------
  # is-a relationship end
  # ---------------------------------------------------------
  isAEnd:
    type: object
    properties:
      cclass: { type: string }
      properties:
        type: array
        items: { type: string }
    required: ["cclass", "properties"]

# main CIM structure definition
properties:
  domain:
    type: object
    required:
      - name
      - classes
      - relationships
    properties:
      name:
        type: string
      description:
        type: string
        
      # class definition structure
      classes:
        type: object
        required:
          - class
        properties:
          class:
            type: array
            uniqueItems: true
            uniqueItemProperties:
              - key_letter
              - name
              - number
            items:
              $ref: '#/$defs/class'
      # relationship definition structure
      relationships:
        type: object
        required:
          - relationship
        properties:
          relationship:
            type: array
            items:
              $ref: '#/$defs/relationship'

$schema: "https://json-schema.org/draft/2020-12/schema"
title: Conceptual Modeling Minimal Schema
description: A minimal schema for defining a Conceptual Information Model (CIM) in a structured format
type: object
required:
  - domain

$defs:
  # property type definition
  propertyType:
    type: string
    enum:
      - UNIQUE_ID
      - STRING
      - INTEGER
      - BOOLEAN
 
  # conceptual class property structure definition
  cclassProperty:
    type: object
    required:
      - type
    properties:
      type:
        $ref: '#/$defs/propertyType'
  # conceptual class structure definition
  cclass:
    type: object
    required:
      - key_letter
      - properties
    properties:
      key_letter:
        type: string
      properties:
        type: object
        additionalProperties:
          $ref: '#/$defs/cclassProperty'

  # from/to relationship structure definition
  relationshipEnd:
    type: object
    required:
      - multiplicity
      - cclass
      - properties
    properties:
      multiplicity:
        type: string
        enum: ["1", "1C", "M", "MC"]
      cclass:
        type: string
      properties:
        type: array
        items:
          type: string
      phrase:
        type: string

  # relationship structure definition
  relationship:
    type: object
    required:
      - index
      - from
      - to
    properties:
      index:
        type: string
        pattern: "^R[1-9][0-9]*$"
      from:
        $ref: '#/$defs/relationshipEnd'
      to:
        $ref: '#/$defs/relationshipEnd'
      phrase:
        type: string
        pattern: "^'(?:[^']|'{2})*'$"

# main CIM structure definition
properties:
  domain:
    type: object
    required:
      - name
      - classes
      - relationships
    properties:
      name:
        type: string
      description:
        type: string
        
      # conceptual class definition structure
      cclasses:
        type: object
        required:
          - cclass
        properties:
          cclass:
            type: array
            uniqueItems: true
            uniqueItemProperties:
              - key_letter
            items:
              $ref: '#/$defs/cclass'
      # relationship definition structure
      relationships:
        type: object
        required:
          - relationship
        properties:
          relationship:
            type: array
            items:
              $ref: '#/$defs/relationship'
